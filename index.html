<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Плацдарм</title>
<style>
:root{
  --bg:#eef1f6;
  --panel:#ffffff;
  --panel-2:#f3f5f9;
  --line:#d9dfe9;
  --text:#0f172a;
  --muted:#5b6578;
  --accent:#0b7fb8;
  --accent-soft:rgba(11,127,184,.14);
  --danger:#cf3352;
  --ok:#0f8a63;
  --gold:#a86b12;
  --well:#0a0f17;
  --shadow:rgba(15,23,42,.14);
  --primary:#0a84c2;
  --on-primary:#ffffff;
  --me:#0b8fbd;
  --foe:#d6345a;
  --veil:rgba(4,8,14,.55);
  --font:"Exo 2","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0d13;
    --panel:#11161f;
    --panel-2:#171d29;
    --line:#252e3e;
    --text:#e6ebf5;
    --muted:#8e98ac;
    --accent:#3ad7ff;
    --accent-soft:rgba(58,215,255,.16);
    --danger:#ff5b7a;
    --ok:#3ddc97;
    --gold:#ffd166;
    --well:#05080d;
    --shadow:rgba(0,0,0,.55);
    --primary:#22b8ee;
    --on-primary:#03121a;
    --me:#3ad7ff;
    --foe:#ff5b7a;
    --veil:rgba(2,4,8,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0d13;
  --panel:#11161f;
  --panel-2:#171d29;
  --line:#252e3e;
  --text:#e6ebf5;
  --muted:#8e98ac;
  --accent:#3ad7ff;
  --accent-soft:rgba(58,215,255,.16);
  --danger:#ff5b7a;
  --ok:#3ddc97;
  --gold:#ffd166;
  --well:#05080d;
  --shadow:rgba(0,0,0,.55);
  --primary:#22b8ee;
  --on-primary:#03121a;
  --me:#3ad7ff;
  --foe:#ff5b7a;
  --veil:rgba(2,4,8,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
#app{
  height:100%;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}

/* верхняя панель */
.hud{display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.round{font-weight:700;white-space:nowrap;font-size:14px}
.hps{flex:1;display:flex;gap:10px;min-width:0}
.hp{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.hp .who{font-size:12px;color:var(--muted);white-space:nowrap}
.hp .bar{flex:1;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.hp .bar i{display:block;height:100%;width:100%;border-radius:3px;transition:width .5s ease}
.hp.me .bar i{background:var(--me)}
.hp.foe .bar i{background:var(--foe)}
.hp b{font-variant-numeric:tabular-nums;font-size:13px;min-width:2.2em;text-align:right}
.money{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.money .who{font-size:12px;color:var(--muted)}
.money b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--gold)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;flex:none;touch-action:manipulation}
.iconbtn svg{width:18px;height:18px}
@media (max-width:520px){.brand{display:none}.money .who{display:none}.hp .who{display:none}}

/* поле и панель */
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;height:268px;flex:none}
@media (min-width:760px) and (min-aspect-ratio:1/1){
  .main{flex-direction:row}
  .panel{width:340px;height:auto;flex:none;border-top:0;border-left:1px solid var(--line);overflow-y:auto;padding:12px}
}

/* карточки юнитов */
.cards{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.cards::-webkit-scrollbar{display:none}
@media (min-width:760px) and (min-aspect-ratio:1/1){.cards{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}}
.unit{
  position:relative;flex:0 0 78px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 3px 5px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2);
  cursor:pointer;touch-action:manipulation;transition:border-color .15s,transform .1s;
}
.unit:active{transform:scale(.96)}
.unit canvas{width:46px;height:46px;border-radius:8px;background:var(--well)}
.unit .nm{font-size:12px;font-weight:600;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.unit .meta{display:flex;gap:6px;font-size:11.5px;color:var(--muted);line-height:1}
.unit .pr{font-weight:700;color:var(--gold)}
.unit.poor .pr{color:var(--danger)}
.unit.poor canvas{filter:saturate(.25) brightness(.6)}
.unit.sel{border-color:var(--accent);background:var(--accent-soft)}
.unit .hk{position:absolute;top:3px;left:6px;font-size:10px;color:var(--muted);display:none}
@media (hover:hover) and (pointer:fine){.unit .hk{display:block}.unit:hover{border-color:var(--accent)}}
.unit:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#deployUI{display:flex;flex-direction:column;gap:8px;min-height:0}
@media (min-width:760px) and (min-aspect-ratio:1/1){#deployUI{flex:1}.info{flex:1}}
/* сведения */
.info{font-size:13px;line-height:1.35;height:96px;overflow-y:auto}
.info .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.info .head b{font-size:15px}
.info .tag{font-size:12px;color:var(--muted)}
.info .lvl{color:var(--gold);font-weight:700;font-size:12px}
.info .desc{color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chips span{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.vs{margin-top:5px;font-size:12px;display:grid;gap:1px}
.vs .good b{color:var(--ok)}
.vs .bad b{color:var(--danger)}
.info .hint{color:var(--muted)}
.row-btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
@media (max-width:759px),(max-aspect-ratio:1/1){.info .desc{display:none}}
@media (min-width:760px) and (min-aspect-ratio:1/1){.info{height:auto;min-height:62px}}

/* кнопки */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;
  border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;cursor:pointer;touch-action:manipulation;
}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-size:16px;min-height:46px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2)}
.seg button{flex:1;min-height:38px;border:0;background:transparent;font-weight:700;cursor:pointer;touch-action:manipulation}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}

/* бой */
.tally{display:flex;justify-content:space-between;font-size:14px}
.tally .me b{color:var(--me)}
.tally .foe b{color:var(--foe)}
.battle-row{display:flex;gap:8px;align-items:center}
.battle-row .seg{flex:1}
.armies{display:grid;gap:6px;margin-top:10px}
.army{display:flex;flex-wrap:wrap;gap:4px}
.army span{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.army.me span{border-color:color-mix(in srgb,var(--me) 45%,var(--line))}
.army.foe span{border-color:color-mix(in srgb,var(--foe) 45%,var(--line))}
.army .none{color:var(--muted)}

/* оверлеи */
.toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;max-width:92%;
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;
  padding:7px 14px;font-weight:600;font-size:13px;box-shadow:0 8px 24px var(--shadow);pointer-events:none;text-align:center;
}
.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:14px;background:var(--veil)}
.ocard{
  width:min(380px,100%);max-height:100%;overflow-y:auto;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:14px;padding:20px 18px 18px;box-shadow:0 20px 50px var(--shadow);
  animation:pop .25s ease both;
}
.ocard h2{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.ocard .sub{margin:6px 0 0;color:var(--muted)}
.ocard ol{margin:12px 0 4px;padding-left:20px;line-height:1.45}
.ocard ol li+li{margin-top:4px}
.ocard .label{font-size:12px;color:var(--muted);margin:14px 0 6px}
.ocard .stack{display:grid;gap:8px;margin-top:16px}
.res-lines{margin:12px 0 0;display:grid;gap:4px;font-size:15px}
.res-lines .neg b{color:var(--danger)}
.res-lines .pos b{color:var(--ok)}
.res-lines .muted{color:var(--muted);font-size:13px}
.win h2{color:var(--ok)}
.lose h2{color:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

/* онлайн */
.opp{font-size:13px;color:var(--muted);text-align:center;line-height:1.3}
.opp b{color:var(--text)}
.opp.ready b{color:var(--ok)}
body.online .panel{height:278px}
@media (min-width:760px) and (min-aspect-ratio:1/1){body.online .panel{height:auto}}
.sect{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sect h3{margin:0 0 8px;font-size:15px;font-weight:700}
.sect .label{margin-top:0}
.inp{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:0 12px;font:inherit;font-size:15px;-webkit-user-select:text;user-select:text}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.joinrow{display:flex;gap:8px}
.joinrow .inp{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.12em}
.bigcode{font-size:44px;font-weight:800;letter-spacing:.16em;text-align:center;margin:10px 0 4px;color:var(--accent);font-variant-numeric:tabular-nums}
.reline{min-height:1.3em;text-align:center;color:var(--muted);margin-top:10px;font-size:13px}
@media (prefers-reduced-motion:reduce){.ocard{animation:none}.unit,.hp .bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand">Плацдарм</div>
    <div class="round" id="roundLbl">Раунд 1</div>
    <div class="hps">
      <div class="hp me" title="Твоя база"><span class="who">Ты</span><div class="bar"><i id="hpMeBar"></i></div><b id="hpMe">300</b></div>
      <div class="hp foe" title="База соперника"><span class="who" id="foeName">Бот</span><div class="bar"><i id="hpFoeBar"></i></div><b id="hpFoe">300</b></div>
    </div>
    <div class="money" title="Кредиты"><span class="who">Кредиты</span><b id="credits">200</b></div>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <main class="main">
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="Поле боя"></canvas>
      <div class="toast" id="toast" role="status" hidden></div>
      <div class="overlay" id="overlay" hidden><div class="ocard" id="ocard"></div></div>
    </section>
    <aside class="panel" id="panel">
      <div id="deployUI">
        <div class="cards" id="cards"></div>
        <div class="info" id="info"></div>
        <div class="opp" id="oppLine" hidden></div>
        <button class="btn primary wide" id="fightBtn" type="button">В бой</button>
      </div>
      <div id="battleUI" hidden>
        <div class="tally"><span class="me">Твои: <b id="aliveMe">0</b></span><span class="foe"><span id="aliveFoeLbl">Бот</span>: <b id="aliveFoe">0</b></span></div>
        <div class="battle-row" style="margin-top:8px">
          <div class="seg" id="speedSeg" role="group" aria-label="Скорость боя">
            <button type="button" data-speed="1">×1</button><button type="button" data-speed="2">×2</button><button type="button" data-speed="4">×4</button>
          </div>
          <button class="btn" id="skipBtn" type="button">Пропустить</button>
        </div>
        <div class="armies"><div class="army me" id="armyMe"></div><div class="army foe" id="armyFoe"></div></div>
      </div>
    </aside>
  </main>
</div>
<script>

<script>
/* ===================== ЯДРО: юниты, бой, бот (без DOM) ===================== */
'use strict';

const FW = 360, FH = 500, SLOT = 36, COLS = 10, ROWS = 4, ZONE = ROWS * SLOT;
const DT = 1 / 30, BATTLE_TIME = 75;
const ARMOR = 0.5;                      // тяжёлая броня режет урон пулемётов, дронов и молний
const LVL_MUL = [1, 1.6, 2.2];          // множитель здоровья и урона по уровням
const LOSS_MUL = [1, 1.5, 2];           // во сколько раз больше урона базе наносит выживший юнит
const UPG_COST = [0.6, 0.9];            // цена улучшения до 2 и 3 уровня (доля цены отряда)
const START_HP = 300, START_CREDITS = 200, MAX_ROUNDS = 15;
const income = (r) => 150 + 25 * (r - 1);

// atk: melee | gun | rail | tesla | beam | shell | bolt | flak
const UT = [
  { k: 'swarm', name: 'Рой', cost: 50, cnt: 16, hp: 40, dmg: 7, cd: 0.5, rng: 3, spd: 72, r: 3.5,
    air: false, gnd: true, aa: false, heavy: false, front: true, loss: 1, atk: 'melee',
    desc: 'Орда мелких дронов ближнего боя. Дёшево, быстро, давит числом.' },
  { k: 'hound', name: 'Гончие', cost: 75, cnt: 8, hp: 90, dmg: 9, cd: 0.4, rng: 110, spd: 56, r: 5,
    air: false, gnd: true, aa: true, heavy: false, front: true, loss: 2, atk: 'gun',
    desc: 'Лёгкие пулемётные мехи. Бьют и по земле, и по воздуху.' },
  { k: 'rail', name: 'Рельсотрон', cost: 100, cnt: 2, hp: 280, dmg: 150, cd: 2.6, rng: 240, spd: 40, r: 8,
    air: false, gnd: true, aa: false, heavy: false, loss: 6, atk: 'rail', vsHeavy: 2.5, pref: 'heavy',
    desc: 'Дальнобойный снайпер. Медленно, но очень больно, особенно по тяжёлым.' },
  { k: 'tesla', name: 'Тесла', cost: 100, cnt: 2, hp: 350, dmg: 55, cd: 0.9, rng: 95, spd: 42, r: 8.5,
    air: false, gnd: true, aa: false, heavy: false, loss: 6, atk: 'tesla', jumps: 6, jumpR: 45, fall: 0.85,
    desc: 'Цепная молния перескакивает между целями. Выжигает толпы.' },
  { k: 'goliath', name: 'Голиаф', cost: 150, cnt: 1, hp: 2600, dmg: 30, cd: 0, rng: 85, spd: 30, r: 15,
    air: false, gnd: true, aa: false, heavy: true, front: true, loss: 15, atk: 'beam', ramp: 60, maxDps: 300,
    desc: 'Тяжёлый танк с лучом, который разогревается, пока держит одну цель.' },
  { k: 'arty', name: 'Гаубица', cost: 150, cnt: 2, hp: 260, dmg: 90, cd: 2.8, rng: 320, minRng: 70, spd: 28, r: 9.5,
    air: false, gnd: true, aa: false, heavy: true, loss: 8, atk: 'shell', splash: 34,
    desc: 'Артиллерия через всё поле, бьёт по площади. Не стреляет вплотную.' },
  { k: 'wasp', name: 'Осы', cost: 125, cnt: 4, hp: 160, dmg: 16, cd: 0.6, rng: 70, spd: 90, r: 7,
    air: true, gnd: true, aa: false, heavy: false, loss: 4, atk: 'bolt',
    desc: 'Штурмовые дроны. Летают, поэтому их достают только Гончие и Зенитки.' },
  { k: 'flak', name: 'Зенитка', cost: 75, cnt: 2, hp: 300, dmg: 45, cd: 0.9, rng: 180, spd: 40, r: 8.5,
    air: false, gnd: true, aa: true, heavy: false, loss: 4, atk: 'flak', splash: 16, gndMul: 0.3, pref: 'air',
    desc: 'ПВО с осколочными разрывами. По наземным целям почти бесполезна.' },
];
const KI = {};
UT.forEach((T, i) => { KI[T.k] = i; T.i = i; });

// кто кого контрит
const BEATS = {
  swarm: ['rail', 'goliath', 'flak'],
  hound: ['rail', 'wasp'],
  rail: ['goliath', 'flak', 'arty'],
  tesla: ['swarm', 'hound'],
  goliath: ['hound', 'tesla', 'flak'],
  arty: ['swarm', 'hound', 'tesla'],
  wasp: ['goliath', 'arty', 'rail', 'tesla', 'swarm'],
  flak: ['wasp'],
};
const ADV = UT.map((A) => UT.map((B) => (BEATS[A.k].includes(B.k) ? 1 : BEATS[B.k].includes(A.k) ? -1 : 0)));
UT.forEach((T, i) => {
  T.strong = UT.filter((_, j) => ADV[i][j] > 0).map((B) => B.name);
  T.weak = UT.filter((_, j) => ADV[i][j] < 0).map((B) => B.name);
});

/* ---------- построения отрядов ---------- */
const FORM = {
  1: [[0, 0]],
  2: [[-8.5, 0], [8.5, 0]],
  4: [[-7.5, -7.5], [7.5, -7.5], [-7.5, 7.5], [7.5, 7.5]],
  8: [[-11, -11], [0, -11], [11, -11], [-11, 0], [0, 0], [11, 0], [-5.5, 11], [5.5, 11]],
  16: (() => { const a = []; for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) a.push([-12 + i * 8, -12 + j * 8]); return a; })(),
};
function slotCenter(side, col, row) {
  return { x: col * SLOT + SLOT / 2, y: side === 0 ? FH - ZONE + row * SLOT + SLOT / 2 : ZONE - row * SLOT - SLOT / 2 };
}
function squadPositions(sq) {
  const c = slotCenter(sq.side, sq.col, sq.row), m = sq.side === 0 ? 1 : -1;
  return FORM[UT[sq.t].cnt].map(([ox, oy]) => [c.x + ox, c.y + oy * m]);
}

/* ---------- случайность с зерном: бой у всех считается одинаково ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const mixSeed = (a, b) => (Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x632BE5AB, 0xC2B2AE35)) >>> 0;

/* ---------- бой ---------- */
const GC = 30, GW = Math.ceil(FW / GC), GH = Math.ceil(FH / GC);

function createBattle(squads, seed, quiet) {
  const rng = mulberry32(seed);
  const b = { t: 0, rng, units: [], shells: [], ev: [], hurt: [], alive: [0, 0], over: false, res: null, quiet: !!quiet, grid: [] };
  for (let i = 0; i < GW * GH; i++) b.grid.push([]);
  let id = 1;
  for (const sq of squads.slice().sort((a, c) => a.id - c.id)) {
    const T = UT[sq.t], m = LVL_MUL[sq.lvl - 1];
    for (const [x, y] of squadPositions(sq)) {
      b.units.push({
        id: id++, side: sq.side, t: sq.t, T, lvl: sq.lvl, mul: m, sq: sq.id,
        x, y, px: x, py: y, vx: 0, vy: 0, fx: 0, fy: sq.side === 0 ? -1 : 1,
        hp: T.hp * m, mhp: T.hp * m, r: T.r, air: T.air, alive: true,
        cd: (T.cd || 1) * (0.15 + 0.85 * rng()), tgt: null, rt: 0, bT: 0, bTgt: null, beam: null, pend: 0,
      });
      b.alive[sq.side]++;
    }
  }
  if (!b.alive[0] || !b.alive[1]) finish(b);
  return b;
}

function gridBuild(b) {
  const g = b.grid;
  for (let i = 0; i < g.length; i++) g[i].length = 0;
  for (const u of b.units) {
    if (!u.alive) continue;
    const gx = Math.min(GW - 1, Math.max(0, (u.x / GC) | 0)), gy = Math.min(GH - 1, Math.max(0, (u.y / GC) | 0));
    g[gy * GW + gx].push(u);
  }
}
function near(b, x, y, rad, fn) {
  const x0 = Math.max(0, Math.floor((x - rad) / GC)), x1 = Math.min(GW - 1, Math.floor((x + rad) / GC));
  const y0 = Math.max(0, Math.floor((y - rad) / GC)), y1 = Math.min(GH - 1, Math.floor((y + rad) / GC));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
    const c = b.grid[gy * GW + gx];
    for (let i = 0; i < c.length; i++) fn(c[i]);
  }
}
function edge(u, v) { const dx = v.x - u.x, dy = v.y - u.y; return Math.sqrt(dx * dx + dy * dy) - u.r - v.r; }
function canHit(u, v) { return v.air ? u.T.aa : u.T.gnd; }
function inRange(u, t) {
  const e = edge(u, t);
  return e <= u.T.rng && !(u.T.minRng && e < u.T.minRng);
}
function pickTarget(b, u) {
  const T = u.T;
  let best = null, bs = Infinity;
  for (const v of b.units) {
    if (!v.alive || v.side === u.side || !canHit(u, v)) continue;
    const e = edge(u, v);
    if (T.minRng && e < T.minRng) continue;
    let s = e;
    if (T.pref === 'heavy' && v.T.heavy) s -= 90;
    else if (T.pref === 'air' && v.air) s -= 120;

  }

}
function nearestGround(b, u) {

    if (e < bd) { bd = e; best = v; }
  }
  return best;
}
// урон копится за такт и применяется разом, чтобы порядок обработки юнитов ни на что не влиял
function hurt(b, v, d) {

}
function resolve(b) {

    if (v.hp <= 0 && v.alive) {
      v.hp = 0; v.alive = false; b.alive[v.side]--;
      b.quiet || b.ev.push({ k: 'die', x: v.x, y: v.y, r: v.r, side: v.side, air: v.air, t: v.t });
    }

function attack(b, u, t) {
  const T = u.T, d = T.dmg * u.mul;

    case 'melee':
      hurt(b, t, d);

      break;
    case 'gun': case 'bolt':
      hurt(b, t, t.T.heavy ? d * ARMOR : d);
      b.quiet || b.ev.push({ k: T.atk, x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side, air: u.air });
      break;
    case 'rail':
      hurt(b, t, d * (t.T.heavy ? T.vsHeavy : 1));
      b.quiet || b.ev.push({ k: 'rail', x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side });
      break;
    case 'tesla': {
      const pts = [u.x, u.y, t.x, t.y], hit = [t];
      let cur = t, dd = d;
      hurt(b, t, t.T.heavy ? dd * ARMOR : dd);
      for (let j = 0; j < T.jumps; j++) {
        dd *= T.fall;
        let nb = null, nd = Infinity;
        near(b, cur.x, cur.y, T.jumpR + 20, (v) => {
          if (!v.alive || v.side === u.side || v.air || hit.indexOf(v) >= 0) return;
          const e = edge(cur, v);

        });

      b.quiet || b.ev.push({ k: 'tesla', pts, side: u.side });
      break;
    }
    case 'shell': {
      const dx = t.x - u.x, dy = t.y - u.y, dist = Math.sqrt(dx * dx + dy * dy);
      const fl = 0.35 + dist / 380;
      const tvx = (t.x - t.px) / DT, tvy = (t.y - t.py) / DT;
      const x1 = Math.min(FW, Math.max(0, t.x + tvx * fl + (b.rng() - 0.5) * 12));
      const y1 = Math.min(FH, Math.max(0, t.y + tvy * fl + (b.rng() - 0.5) * 12));
      b.shells.push({ x0: u.x, y0: u.y, x1, y1, t: 0, T: fl, dmg: d, rad: T.splash, side: u.side, done: false });
      b.quiet || b.ev.push({ k: 'launch', x: u.x, y: u.y, fx: u.fx, fy: u.fy, side: u.side });

    }
    case 'flak':

        hurt(b, t, d);

          if (v === t || !v.alive || v.side === u.side || !v.air) return;
          const dx = v.x - t.x, dy = v.y - t.y, rr = T.splash + v.r;
          if (dx * dx + dy * dy <= rr * rr) hurt(b, v, d * 0.5);
        });
        b.quiet || b.ev.push({ k: 'flak', x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side });
      } else {
        hurt(b, t, d * T.gndMul * (t.T.heavy ? ARMOR : 1));
        b.quiet || b.ev.push({ k: 'gun', x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side });
      }

}

function beamTick(b, u, t) {
  const T = u.T;
  if (t && t.alive && inRange(u, t)) {
    if (u.bTgt === t) u.bT += DT; else { u.bTgt = t; u.bT = 0; }
    u.beam = t;
    hurt(b, t, Math.min(T.dmg + T.ramp * u.bT, T.maxDps) * u.mul * DT);
  } else { u.beam = null; u.bTgt = null; u.bT = 0; }
}

function step(b) {
  if (b.over) return;
  const U = b.units;
  gridBuild(b);
  // 1. цели и куда ехать
  for (let i = 0; i < U.length; i++) {
    const u = U[i];
    if (!u.alive) continue;
    const T = u.T;
    u.px = u.x; u.py = u.y;
    u.cd -= DT; u.rt -= DT;
    let t = u.tgt;
    if (!t || !t.alive || u.rt <= 0) {
      if (!(t && t.alive && inRange(u, t))) t = pickTarget(b, u);
      u.tgt = t;
      u.rt = 0.35 + (u.id % 9) * 0.02;
    }
    let mx = 0, my = 0, sp = T.spd;
    if (t) {
      const dx = t.x - u.x, dy = t.y - u.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      u.fx = dx / d; u.fy = dy / d;
      if (d - u.r - t.r > T.rng * 0.92) { mx = u.fx; my = u.fy; }
    } else if (T.minRng) {
      // гаубица не стреляет вплотную: отъезжает от ближайшего врага
      const e = nearestGround(b, u);
      if (e) {
        const dx = u.x - e.x, dy = u.y - e.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        if (d < T.minRng + 40) { mx = dx / d; my = dy / d; sp *= 0.6; }
      }
    }
    u.vx += (mx * sp - u.vx) * 0.35;
    u.vy += (my * sp - u.vy) * 0.35;
  }
  // 2. движение
  for (const u of U) if (u.alive) { u.x += u.vx * DT; u.y += u.vy * DT; }
  // 3. расталкивание (тяжёлые почти не сдвигаются)
  for (let i = 0; i < U.length; i++) {
    const u = U[i];
    if (!u.alive) continue;
    near(b, u.x, u.y, u.r + 16, (v) => {
      if (v.id <= u.id || !v.alive || v.air !== u.air) return;

    u.y = Math.min(FH - u.r, Math.max(u.r, u.y));
  }

  for (const u of U) {

    u.cd = u.T.cd;
    attack(b, u, t);
  }
  // 5. снаряды гаубиц

    s.t += DT;
    if (s.t < s.T) continue;
    s.done = true;
    near(b, s.x1, s.y1, s.rad + 16, (v) => {
      if (!v.alive || v.side === s.side || v.air) return;
      const dx = v.x - s.x1, dy = v.y - s.y1, e = Math.sqrt(dx * dx + dy * dy) - v.r;
      if (e > s.rad) return;
      hurt(b, v, s.dmg * (e <= s.rad * 0.4 ? 1 : 1 - 0.5 * (e - s.rad * 0.4) / (s.rad * 0.6)));
    });

  if (b.shells.length) b.shells = b.shells.filter((s) => !s.done);
  resolve(b);
  b.t += DT;
  if (!b.alive[0] || !b.alive[1] || b.t >= BATTLE_TIME) finish(b);
}

function finish(b) {
  b.over = true;
  const loss = [0, 0], left = [0, 0];
  for (const u of b.units) if (u.alive) { loss[u.side] += u.T.loss * LOSS_MUL[u.lvl - 1]; left[u.side]++; }
  let win = -1;
  if (left[0] && !left[1]) win = 0;
  else if (left[1] && !left[0]) win = 1;
  else if (left[0] && left[1]) win = loss[0] > loss[1] ? 0 : loss[1] > loss[0] ? 1 : -1;
  // урон стороне = ценность выживших врагов
  b.res = { win, dmg: [Math.round(loss[1]), Math.round(loss[0])], left, timeout: !!(left[0] && left[1]) };
}

function runBattle(squads, seed) {
  const b = createBattle(squads, seed, true);
  while (!b.over) step(b);
  return b;
}

/* ---------- партия ---------- */
const DIFF = { easy: 0.8, normal: 1, hard: 1.25 };
function newGame(seed, diff) {
  const k = DIFF[diff] || 1;
  return {
    v: 1, seed: seed >>> 0, diff: diff in DIFF ? diff : 'normal', round: 1, hp: [START_HP, START_HP],
    credits: [START_CREDITS, Math.round(START_CREDITS * k)], squads: [], nextId: 1, botRound: 0, over: null, history: [],
  };
}
function upgradeCost(sq) { return sq.lvl >= 3 ? 0 : Math.round(UT[sq.t].cost * UPG_COST[sq.lvl - 1]); }
function slotTaken(state, side, col, row) { return state.squads.some((s) => s.side === side && s.col === col && s.row === row); }
function battleSeed(state) { return mixSeed(state.seed, state.round); }

// итог раунда: урон, доход, конец партии
function applyResult(state, res) {
  state.hp[0] = Math.max(0, state.hp[0] - res.dmg[0]);
  state.hp[1] = Math.max(0, state.hp[1] - res.dmg[1]);
  state.history.push({ round: state.round, win: res.win, dmg: res.dmg.slice() });
  const dead0 = state.hp[0] <= 0, dead1 = state.hp[1] <= 0;
  if (dead0 || dead1 || state.round >= MAX_ROUNDS) {
    state.over = { win: state.hp[0] > state.hp[1] ? 0 : state.hp[1] > state.hp[0] ? 1 : -1 };
    return;
  }
  state.round++;
  state.credits[0] += income(state.round);
  state.credits[1] += Math.round(income(state.round) * (DIFF[state.diff] || 1));
}

/* ---------- бот ---------- */
const BOT_ROWS = { swarm: [0, 1], hound: [0, 1, 2], rail: [3, 2], tesla: [0, 1], goliath: [0, 1], arty: [3, 2], wasp: [2, 3, 1], flak: [1, 2] };

function botSlot(state, side, t, foeSquads, rng) {
  const pref = BOT_ROWS[UT[t].k];
  let tx = (COLS - 1) / 2;
  if (foeSquads.length) tx = foeSquads.reduce((a, s) => a + s.col, 0) / foeSquads.length;
  let best = null, bs = -Infinity;
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    if (slotTaken(state, side, col, row)) continue;
    const rank = pref.indexOf(row);
    const s = (rank < 0 ? -6 : -rank * 2) - Math.abs(col - tx) * 0.35 + rng() * 1.8;
    if (s > bs) { bs = s; best = { col, row }; }
  }
  return best;
}

// бот видит армию игрока только на начало раунда, как и игрок видит армию бота
function botDeploy(state, side, rng) {
  const foe = 1 - side;
  const vis = state.squads.filter((s) => s.side === foe && s.rp < state.round);
  const mine = state.squads.filter((s) => s.side === side);
  const foeVal = UT.map(() => 0), myVal = UT.map(() => 0);
  for (const s of vis) foeVal[s.t] += UT[s.t].cost * LVL_MUL[s.lvl - 1];
  for (const s of mine) myVal[s.t] += UT[s.t].cost * LVL_MUL[s.lvl - 1];
  const foeTotal = foeVal.reduce((a, c) => a + c, 0);

  const typeScore = (t) => {
    const T = UT[t], myTotal = myVal.reduce((a, c) => a + c, 0);
    const spread = (myVal[t] / (myTotal + 150)) * (foeTotal ? 0.7 : 1.2);   // не складывать всё в один тип
    if (!foeTotal) return (T.front ? 0.3 : 0) + (T.k === 'flak' ? -0.5 : 0) - spread;
    let s = 0;
    for (let p = 0; p < UT.length; p++) s += ADV[t][p] * foeVal[p];
    s = s / foeTotal - spread;
    if (T.front) {
      const front = UT.reduce((a, U2, i) => a + (U2.front ? myVal[i] : 0), 0);
      s += Math.max(0, 0.35 - front / (myTotal + 1)) * 1.2;  // впереди нужна «стенка»
    }
    if (T.k === 'flak' && !foeVal[KI.wasp]) s -= 0.6;         // ПВО без авиации у врага бесполезно
    return s;
  };

  let credits = state.credits[side], actions = 0;
  while (actions < 8) {
    let best = null, bs = -Infinity;
    for (let t = 0; t < UT.length; t++) {
      if (UT[t].cost > credits) continue;
      const s = typeScore(t) + (rng() - 0.5) * 0.5;
      if (s > bs) { bs = s; best = { buy: t }; }
    }
    // улучшение уже стоящего отряда — альтернатива покупке
    if (state.round >= 3) for (const sq of state.squads) {
      if (sq.side !== side || sq.lvl >= 3) continue;
      const c = upgradeCost(sq);
      if (c > credits) continue;
      const s = typeScore(sq.t) + 0.12 + (UT[sq.t].cost >= 100 ? 0.08 : 0) - 0.15 * (sq.lvl - 1) + (rng() - 0.5) * 0.5;
      if (s > bs) { bs = s; best = { up: sq }; }
    }
    if (!best) break;
    if (best.up) {
      credits -= upgradeCost(best.up);
      myVal[best.up.t] += UT[best.up.t].cost * (LVL_MUL[best.up.lvl] - LVL_MUL[best.up.lvl - 1]);
      best.up.lvl++;
    } else {
      const slot = botSlot(state, side, best.buy, vis, rng);
      if (!slot) break;
      state.squads.push({ id: state.nextId++, side, t: best.buy, col: slot.col, row: slot.row, lvl: 1, rp: state.round, paid: UT[best.buy].cost });
      credits -= UT[best.buy].cost;
      myVal[best.buy] += UT[best.buy].cost;
    }
    actions++;
  }
  state.credits[side] = credits;
  state.botRound = state.round;
}


/* ---------- умный бот: прогоняет пробные бои против видимой армии игрока ---------- */
const unitValue = (sq) => UT[sq.t].cost * LVL_MUL[sq.lvl - 1];
function battleScore(squads, side, seed) {
  const b = createBattle(squads, seed, true);
  while (!b.over && b.t < 30) step(b);
  let v = 0;
  for (const u of b.units) if (u.alive) v += (u.side === side ? 1 : -1) * (UT[u.t].cost / UT[u.t].cnt) * u.mul;
  return v;
}
// простая оценка «кто кого контрит» по видимой армии: подсказка к пробным боям
function botHeuristic(state, side) {
  const foe = 1 - side, foeVal = UT.map(() => 0), myVal = UT.map(() => 0);
  for (const q of state.squads) {
    if (q.side === foe && q.rp < state.round) foeVal[q.t] += unitValue(q);
    else if (q.side === side) myVal[q.t] += unitValue(q);
  }
  const foeTotal = foeVal.reduce((a, c) => a + c, 0), myTotal = myVal.reduce((a, c) => a + c, 0);
  return UT.map((T, t) => {
    let v = 0;
    if (foeTotal) { for (let p = 0; p < UT.length; p++) v += ADV[t][p] * foeVal[p]; v /= foeTotal; }
    v -= (myVal[t] / (myTotal + 150)) * 0.7;
    if (T.k === 'flak' && !foeVal[KI.wasp]) v -= 0.6;
    return v;
  });
}
// генератор: отдаёт управление после каждого пробного боя, чтобы страница не подвисала
function* botThink(state, side, rng, depth = 4) {
  const foe = 1 - side;
  // копии: игрок может улучшать старые отряды, пока бот думает, а бот должен видеть их на начало раунда
  const vis = state.squads.filter((q) => q.side === foe && q.rp < state.round).map((q) => Object.assign({}, q));
  if (!vis.length) { botDeploy(state, side, rng); return; }
  const seed = mixSeed(state.seed ^ 0x2545F491, state.round);
  const mine = () => state.squads.filter((q) => q.side === side);
  let base = battleScore(vis.concat(mine()), side, seed);
  yield;
  for (let a = 0; a < depth; a++) {
    const credits = state.credits[side], heur = botHeuristic(state, side), cands = [];
    for (let t = 0; t < UT.length; t++) {
      if (UT[t].cost > credits) continue;
      const slot = botSlot(state, side, t, vis, rng);
      if (slot) cands.push({ t, slot, cost: UT[t].cost, h: heur[t] });
    }
    const ups = mine().filter((q) => q.lvl < 3 && upgradeCost(q) <= credits).sort((x, y) => unitValue(y) - unitValue(x)).slice(0, 2);
    for (const q of ups) cands.push({ up: q, t: q.t, cost: upgradeCost(q), h: heur[q.t] });
    if (!cands.length) break;
    let best = null, bs = -Infinity;
    for (const c of cands) {
      const army = c.up
        ? vis.concat(mine().map((q) => (q === c.up ? Object.assign({}, q, { lvl: q.lvl + 1 }) : q)))
        : vis.concat(mine(), [{ id: 1e6, side, t: c.t, col: c.slot.col, row: c.slot.row, lvl: 1, rp: state.round }]);

  const depth = BOT_DEPTH[state.diff] ?? 2;

  const t0 = performance.now();

  }

}

/* ===================== ОНЛАЙН ===================== */
// Комната в базе: rooms/КОД = { p: {s0, s1} игроки, on: {s0, s1} кто в сети, cur: номер партии,
//   gN: { seed, rR: { c: {s0, s1} хеши ходов, v: {s0, s1} раскрытые ходы, h: {s0, s1} сверка итога } }, re: голоса за реванш }
// Ход сначала фиксируется хешем, а раскрывается, только когда готовы оба: подсмотреть чужую расстановку нельзя.
// Бой каждый считает у себя: при одинаковых ходах он совпадает до бита.
const FB_VER = '10.12.2';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const DEV = /[?&]dev(?:[&=]|$)/.test(location.search);   // ?dev — локальная имитация сервера для проверки в двух вкладках
let net = null, on = null;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
async function getNet() {
  if (net) return net;
  if (DEV) return (net = localNet());
  const cfg = window.FIREBASE_CONFIG || {};
  if (!cfg.apiKey || !cfg.databaseURL) throw new Error('nocfg');
  if (!window.firebase || !window.firebase.database) {
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
  }
  const fb = window.firebase, app = fb.apps.length ? fb.app() : fb.initializeApp(cfg);
  return (net = fbNet(app.database()));
}
function fbNet(db) {
  const ref = (code) => db.ref('rooms/' + code);
  return {
    watch(code, cb) { const r = ref(code), h = (s) => cb(s.val()); r.on('value', h, () => cb(undefined)); return () => r.off('value', h); },
    update(code, patch) { return ref(code).update(patch); },
    async get(code) { return (await ref(code).once('value')).val(); },
    async txn(code, fn) { const r = await ref(code).transaction(fn); return { ok: r.committed, room: r.snapshot.val() }; },
    presence(code, side) {
      const conn = db.ref('.info/connected'), me = db.ref(`rooms/${code}/on/s${side}`);
      const h = (s) => { if (s.val() === true) { me.onDisconnect().set(false); me.set(true); } };
      conn.on('value', h);
      return () => { conn.off('value', h); me.onDisconnect().cancel(); me.set(false); };
    },
  };
}
// то же самое без сервера, только для проверки (?dev): каждое поле комнаты — отдельная запись в общем
// хранилище браузера, как пути в Firebase. Сигнал — событие storage: оно приходит, когда данные уже видны.
function localNet() {
  const P = 'plazdarm.dev.', subs = new Map(), timers = {};
  const keysOf = (code) => {
    const pre = P + code + '/', ks = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(pre)) ks.push(k); }
    return ks;
  };
  const read = (code) => {
    const pre = P + code + '/', ks = keysOf(code);
    if (!ks.length) return null;
    const room = {};
    for (const k of ks) {
      const path = k.slice(pre.length).split('/');
      let o = room;
      for (let i = 0; i < path.length - 1; i++) { if (!o[path[i]] || typeof o[path[i]] !== 'object') o[path[i]] = {}; o = o[path[i]]; }
      try { o[path[path.length - 1]] = JSON.parse(localStorage.getItem(k)); } catch (e) { /* пусто */ }
    }
    return room;
  };
  const fire = (code, delay) => {
    clearTimeout(timers[code]);
    timers[code] = setTimeout(() => { const room = read(code); for (const cb of subs.get(code) || []) cb(room ? clone(room) : null); }, delay);
  };
  addEventListener('storage', (e) => {
    if (!e.key || !e.key.startsWith(P)) return;
    const code = e.key.slice(P.length).split('/')[0];
    if (subs.has(code)) fire(code, 60);    // пачку изменений из другой вкладки собираю целиком
  });
  const setPath = (code, path, v) => {
    const base = P + code + '/' + path, parts = path.split('/');
    for (let i = 1; i < parts.length; i++) localStorage.removeItem(P + code + '/' + parts.slice(0, i).join('/'));
    for (const k of keysOf(code)) if (k === base || k.startsWith(base + '/')) localStorage.removeItem(k);
    if (v === null || v === undefined) return;
    if (typeof v !== 'object') { localStorage.setItem(base, JSON.stringify(v)); return; }
    const walk = (o, p) => { for (const k in o) { const x = o[k]; if (x !== null && typeof x === 'object') walk(x, p + '/' + k); else if (x !== undefined && x !== null) localStorage.setItem(p + '/' + k, JSON.stringify(x)); } };
    walk(v, base);
  };
  const api = {
    watch(code, cb) { if (!subs.has(code)) subs.set(code, new Set()); subs.get(code).add(cb); fire(code, 10); return () => subs.get(code).delete(cb); },
    async update(code, patch) { for (const k in patch) setPath(code, k, patch[k]); fire(code, 10); },
    async get(code) { return read(code); },
    async txn(code, fn) {
      const cur = read(code), nv = fn(cur ? clone(cur) : null);
      if (nv === undefined) return { ok: false, room: cur };
      // пишу только изменившиеся верхние поля, чтобы другая вкладка не увидела комнату пустой
      const old = cur || {}, next = nv || {};
      for (const k of new Set([...Object.keys(old), ...Object.keys(next)])) if (JSON.stringify(old[k]) !== JSON.stringify(next[k])) setPath(code, k, next[k] === undefined ? null : next[k]);
      fire(code, 10);
      return { ok: true, room: nv };
    },
    presence(code, side) {
      const k = `on/s${side}`, off = () => { api.update(code, { [k]: false }); };
      api.update(code, { [k]: true });
      addEventListener('pagehide', off);
      return () => { removeEventListener('pagehide', off); off(); };
    },
  };
  return api;
}

const myName = () => (prefs.name || '').trim().slice(0, 16) || 'Игрок';
function codeGen() { let s = ''; for (let i = 0; i < 5; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function urlWith(code) { const u = new URL(location.href); if (code) u.searchParams.set('room', code); else u.searchParams.delete('room'); return u; }
function setRoomParam(code) { try { const u = urlWith(code); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) { /* пусто */ } }
function shareLink(code) { const u = urlWith(code); u.searchParams.delete('pid'); return u.href; }
function onlineError(e) {
  const m = (e && (e.code || e.message)) || '';
  toast(m === 'nocfg' ? 'Онлайн ещё не настроен: в файл нужно вставить конфиг Firebase.'
    : m === 'load' ? 'Не удалось подключиться к серверу. Онлайн работает на сайте игры, когда есть интернет.'
    : /permission|denied|perm/i.test(m) ? 'Сервер отклонил запрос: проверь правила базы в Firebase.'
    : 'Ошибка связи с сервером. Попробуй ещё раз.', 4500);
}

async function hostRoom() {
  let n;
  try { n = await getNet(); } catch (e) { onlineError(e); return; }
  for (let i = 0; i < 6; i++) {
    const code = codeGen(), room = { v: 1, t: Date.now(), p: { s0: { id: PID, nm: myName() } }, cur: 1, g1: { seed: (Math.random() * 4294967296) >>> 0 } };
    try {
      const r = await n.txn(code, (cur) => (cur ? undefined : room));
      if (r.ok) { enterRoom(code, 0); return; }
    } catch (e) { onlineError(e); return; }
  }
  toast('Не удалось создать комнату, попробуй ещё раз');
}
async function joinRoom(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { toast('Код комнаты: 5 букв и цифр'); return; }
  let n;
  try { n = await getNet(); } catch (e) { onlineError(e); return; }
  try {
    await n.get(code);   // прогреваю кеш: транзакция Firebase иначе может начаться с пустого значения
    let side = -1;
    const r = await n.txn(code, (cur) => {
      if (!cur) { side = -1; return cur; }
      const p = cur.p || {};
      if (p.s0 && p.s0.id === PID) { side = 0; return cur; }
      if (p.s1 && p.s1.id === PID) { side = 1; return cur; }
      if (p.s1) { side = -2; return undefined; }
      cur.p = Object.assign({}, p, { s1: { id: PID, nm: myName() } });
      side = 1;
      return cur;
    });
    if (side === -2) { toast('В этой комнате уже двое'); return; }
    if (!r.room || side < 0) { toast('Комнаты с таким кодом нет'); return; }
    enterRoom(code, side);
  } catch (e) { onlineError(e); }
}
function enterRoom(code, side) {
  stopBot();
  if (on) leaveRoom(true);
  mode = 'online'; MY = side; FOE = 1 - side; FLIP = side === 1;
  state = null; battle = null; selType = -1; selSq = null; drag = null;
  clearFx(); clearDecal();
  on = { code, room: null, cache: new Map(), game: 0, shown: -1, uiRound: 0, lvl0: {}, revealed: {}, first: true, warned: false, pending: null, oppName: '' };
  prefs.online = { code }; savePrefs();
  setRoomParam(code);
  phase = 'lobby';
  showLobby();
  on.unwatch = net.watch(code, (room) => { if (on && on.code === code) onRoom(room); });
  on.presOff = net.presence(code, side);
  showPanel(); renderCards();
}
function leaveRoom(keepPref) {
  if (!on) return;
  try { if (on.unwatch) on.unwatch(); } catch (e) { /* пусто */ }
  try { if (on.presOff) on.presOff(); } catch (e) { /* пусто */ }
  on = null;
  if (!keepPref) { prefs.online = null; savePrefs(); setRoomParam(null); }
}
function exitOnline() {
  leaveRoom(false);
  mode = 'bot'; MY = 0; FOE = 1; FLIP = false;
  battle = null; selType = -1; selSq = null; drag = null;
  clearFx(); clearDecal();
  state = loadSave();
  phase = 'menu';
  updateHud(); showPanel(); renderCards(); renderInfo();
  showMenu();
}
function onRoom(room) {
  if (room === undefined) { onlineError({ code: 'permission' }); return; }
  if (!room) { toast('Комната закрыта', 3000); exitOnline(); return; }
  on.room = room;
  syncOnline();
}
// состояние партии целиком выводится из журнала ходов в комнате; посчитанные раунды кешируются
function derive() {
  const room = on.room, n = room.cur || 1, G = room['g' + n];
  if (!G || typeof G.seed !== 'number') return null;
  if (on.game !== n) { on.game = n; on.cache = new Map(); on.shown = -1; on.uiRound = 0; on.revealed = {}; on.first = true; on.rematchFor = 0; }
  let base = onlineGame(G.seed), R = 1, last = 0, bad = -1;
  for (; R <= MAX_ROUNDS; R++) {
    const rd = G['r' + R], v = rd && rd.v;
    if (!v || !v.s0 || !v.s1) break;
    let res = on.cache.get(R);
    if (!res) {
      const c = rd.c || {}, o = [null, null];
      for (const s of [0, 1]) {
        const x = v['s' + s];
        if (x && typeof x.o === 'string' && typeof x.salt === 'string' && cyrb53(x.o + x.salt) === c['s' + s]) {
          try { o[s] = JSON.parse(x.o); } catch (e) { o[s] = null; }
        }
      }
      if (!o[0] || !o[1]) { bad = !o[0] ? 0 : 1; break; }
      res = resolveRound(base, o[0], o[1]);
      if (res.bad !== undefined) { bad = res.bad; break; }
      on.cache.set(R, res);
    }
    base = res.post; last = R;
    if (base.over) break;
  }
  return { n, G, R: base.over ? last : R, base, last, bad, over: !!base.over };
}
function syncOnline() {
  if (!on || !on.room || phase === 'error') return;
  const room = on.room, p = room.p || {}, d = derive();
  if (!d) return;
  const opp = p['s' + FOE];
  on.oppName = opp ? String(opp.nm || 'Соперник').slice(0, 16) : '';
  if (d.bad >= 0) {
    showError(d.bad === MY ? 'Твой ход не прошёл проверку.' : 'Ход соперника не прошёл проверку. Возможно, у вас разные версии игры: обновите страницу оба.');
    return;
  }
  // сверка итогов боёв между игроками
  for (let r = 1; r <= d.last; r++) {
    const res = on.cache.get(r), h = (d.G['r' + r] && d.G['r' + r].h) || {};
    if (!h['s' + MY]) net.update(on.code, { [`g${d.n}/r${r}/h/s${MY}`]: res.check }).catch(() => {});
    else if (h['s' + FOE] && h['s' + FOE] !== res.check && !on.warned) { on.warned = true; toast('Итоги боя у вас разошлись. Если повторится, напиши мне.', 6000); }
  }
  if (on.first) { on.first = false; on.shown = d.last; }      // при входе в комнату прошлые бои не показываю
  const rd = d.G['r' + d.R] || {}, c = rd.c || {}, v = rd.v || {};
  const myCommit = !!c['s' + MY], oppCommit = !!c['s' + FOE];
  if (!d.over && c.s0 && c.s1 && !v['s' + MY]) reveal(d.n, d.R);   // оба готовы: раскрываю свой ход
  setOppLine(!!(room.on && room.on['s' + FOE]), oppCommit, !!opp);
  $('foeName').textContent = on.oppName || 'Соперник';
  if (phase === 'battle' || phase === 'result') return;          // игрок досматривает бой или итоги раунда
  if (d.last > on.shown) { playOnlineRound(on.shown + 1); return; }
  if (d.over) { onlineOver(d); return; }
  if (!opp) {
    phase = 'lobby';
    if (ocard.dataset.kind !== 'menu' && ocard.dataset.kind !== 'lobby') showLobby();
    showPanel();
    return;
  }
  if (ocard.dataset.kind === 'lobby' || ocard.dataset.kind === 'over') closeCard();
  if (on.uiRound !== d.R) {           // новый раунд: рабочая копия общего состояния плюс мой черновик
    on.uiRound = d.R;
    state = clone(d.base);
    on.lvl0 = {};
    for (const q of state.squads) if (q.side === MY) on.lvl0[q.id] = q.lvl;
    if (myCommit) { const sc = loadCommit(d.n, d.R); if (sc) { try { applyOrders(state, MY, JSON.parse(sc.o)); } catch (e) { /* пусто */ } } }
    else restoreDraft(d.n, d.R);
    selType = -1; selSq = null; drag = null;
    battle = null; clearFx(); clearDecal();
  }
  phase = myCommit ? 'wait' : 'deploy';
  updateHud(); showPanel(); renderCards(); renderInfo();
}
function setOppLine(online, ready, present) {
  const el = $('oppLine');
  const nm = `<b>${esc(on.oppName || 'Соперник')}</b>`;
  el.innerHTML = !present ? 'Ждём второго игрока' : !online ? `${nm} не в сети` : ready ? `${nm} готов к бою` : `${nm} расставляет армию`;
  el.classList.toggle('ready', present && online && ready);
}
function collectOrders() {
  const n = [], u = [];
  for (const q of state.squads) {
    if (q.side !== MY) continue;
    if (on.lvl0[q.id] === undefined) n.push([q.t, q.col, q.row, q.lvl]);
    else if (q.lvl > on.lvl0[q.id]) u.push([q.id, q.lvl]);
  }
  return { n, u };
}
function readyOnline() {
  if (mode !== 'online' || !on || phase !== 'deploy' || !overlay.hidden) return;
  if (!state.squads.some((s) => s.side === MY)) { toast('Сначала поставь хотя бы один отряд'); return; }
  const o = JSON.stringify(collectOrders()), salt = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  const n = on.game, R = on.uiRound;
  saveCommit(n, R, { o, salt });
  selType = -1; selSq = null;
  phase = 'wait';
  showPanel(); renderCards(); renderInfo();
  net.update(on.code, { [`g${n}/r${R}/c/s${MY}`]: cyrb53(o + salt) }).catch((e) => { phase = 'deploy'; showPanel(); renderInfo(); onlineError(e); });
}
function reveal(n, R) {
  const key = n + ':' + R;
  if (on.revealed[key]) return;
  const d = loadCommit(n, R);
  if (!d) return;
  on.revealed[key] = true;
  net.update(on.code, { [`g${n}/r${R}/v/s${MY}`]: d }).catch((e) => { on.revealed[key] = false; onlineError(e); });
}
// ход и черновик расстановки переживают перезагрузку страницы
const mem = {};
const skey = (k, n, R) => `plazdarm.${k}.${on.code}.${MY}.${n}.${R}`;
function putStore(key, val) { mem[key] = val; try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* пусто */ } }
function getStore(key) { if (mem[key]) return mem[key]; try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
function saveCommit(n, R, d) { putStore(skey('c', n, R), d); }
function loadCommit(n, R) { return getStore(skey('c', n, R)); }
function saveDraft() { if (on && phase === 'deploy') putStore(skey('d', on.game, on.uiRound), collectOrders()); }
function restoreDraft(n, R) { const o = getStore(skey('d', n, R)); if (o) applyOrders(state, MY, o); }
function playOnlineRound(r) {
  const res = on.cache.get(r);
  if (!res) return;
  on.shown = r; on.pending = res;
  state = clone(res.pre);
  if (ocard.dataset.kind === 'lobby') closeCard();
  launchBattle(state);
}
function endOnlineBattle() {
  const res = on.pending.res, round = state.round, shown = { round, credits: state.credits[MY] };
  state = clone(on.pending.post);
  updateHud(state.over ? null : shown);
  if (state.over) { phase = 'over'; showPanel(); showOver(); syncOnline(); }
  else { phase = 'result'; showPanel(); showResult(res, round); }
}
function nextOnline() {
  closeCard();
  phase = 'sync';
  battle = null; clearFx(); clearDecal();
  syncOnline();
}
function onlineOver(d) {
  if (phase !== 'over') {
    state = clone(d.base);
    if (battle && !battle.over) battle = null;
    phase = 'over';
    updateHud(); showPanel(); showOver();
  }
  const re = on.room.re || {}, line = $('reLine');
  if (line) line.textContent = re['s' + FOE] ? (re['s' + MY] ? 'Начинаем заново…' : 'Соперник хочет реванш') : re['s' + MY] ? 'Ждём ответа соперника' : '';
  if (re.s0 && re.s1 && MY === 0 && on.rematchFor !== d.n) {
    on.rematchFor = d.n;
    net.update(on.code, { cur: d.n + 1, ['g' + (d.n + 1)]: { seed: (Math.random() * 4294967296) >>> 0 }, re: null }).catch(onlineError);
  }
}
function voteRematch() {
  if (!on) return;
  net.update(on.code, { [`re/s${MY}`]: true }).catch(onlineError);
  const l = $('reLine');
  if (l && !l.textContent) l.textContent = 'Ждём ответа соперника';
}
function showLobby() {
  if (!on) return;
  openCard(`<h2>Комната</h2><div class="bigcode">${esc(on.code)}</div>
    <p class="sub" style="text-align:center">Отправь другу ссылку или код. Партия начнётся, как только он войдёт.</p>
    <div class="stack"><button class="btn primary" id="shareBtn" type="button">${navigator.share ? 'Поделиться ссылкой' : 'Скопировать ссылку'}</button>
    <button class="btn" id="leaveBtn" type="button">Выйти из комнаты</button></div>`, '', 'lobby');
  $('shareBtn').onclick = () => shareRoom();
  $('leaveBtn').onclick = () => exitOnline();
}
async function shareRoom() {
  if (!on) return;
  const link = shareLink(on.code);
  try {
    if (navigator.share) { await navigator.share({ title: 'Плацдарм', text: `Заходи в мою комнату в «Плацдарме», код ${on.code}`, url: link }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(link); toast('Ссылка скопирована'); } catch (e) { window.prompt('Скопируй ссылку', link); }
}
function showError(text) {
  phase = 'error';
  openCard(`<h2>Партия остановлена</h2><p class="sub">${esc(text)}</p>
    <div class="stack"><button class="btn primary" id="errBtn" type="button">В меню</button></div>`, 'lose', 'error');
  $('errBtn').onclick = () => { phase = 'menu'; exitOnline(); };
  showPanel();
}

/* ---------- кнопки и клавиши ---------- */
fightBtn.addEventListener('click', () => { if (mode === 'online') readyOnline(); else startBattle(); });
$('skipBtn').addEventListener('click', skipBattle);
$('menuBtn').addEventListener('click', () => {
  if (overlay.hidden || ocard.dataset.kind === 'lobby') showMenu();
  else if (ocard.dataset.kind === 'menu' && phase !== 'menu') { closeCard(); if (mode === 'online') syncOnline(); }
});
for (const b of $('speedSeg').children) b.addEventListener('click', () => { speed = +b.dataset.speed; prefs.speed = speed; savePrefs(); showPanel(); });
window.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if ((e.key === 'Enter' || e.key === ' ') && tag === 'BUTTON') return;   // кнопка сама обработает
  if (!overlay.hidden) {
    if (e.key === 'Escape' && ocard.dataset.kind === 'menu' && phase !== 'menu') { closeCard(); if (mode === 'online') syncOnline(); }
    return;
  }
  if (phase === 'deploy') {
    if (e.key >= '1' && e.key <= String(UT.length)) selectType(+e.key - 1);
    else if (e.key === 'Escape') { selType = -1; selSq = null; renderCards(); renderInfo(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (mode === 'online') readyOnline(); else startBattle(); }
    else if ((e.key === 'u' || e.key === 'г') && selSq) upgradeSquad(selSq);
    else if ((e.key === 'Delete' || e.key === 'Backspace') && selSq) removeSquad(selSq);
  } else if (phase === 'battle') {
    if (e.key === 's' || e.key === 'ы') skipBattle();
    else if (e.key === '1' || e.key === '2' || e.key === '4') { speed = +e.key; prefs.speed = speed; savePrefs(); showPanel(); }
  }
});

/* ---------- старт ---------- */
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(stage);
window.addEventListener('resize', layout);
window.addEventListener('pagehide', save);
state = loadSave();
layout();
renderCards();
updateHud();
showPanel();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
