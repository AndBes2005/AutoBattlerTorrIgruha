<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d11">
<title>Плацдарм</title>
<style>
/* игровая тёмная палитра одна для обеих тем системы: так задумано художественно */
:root{
  --bg:#0b0d11;
  --panel:#12151b;
  --panel-2:#181c24;
  --panel-3:#20252f;
  --line:#272d38;
  --line-2:#3a4251;
  --text:#e6eaf2;
  --muted:#8a93a6;
  --accent:#ffd37f;
  --accent-hi:#ffe4ab;
  --accent-ink:#1c1505;
  --me:#4aa8ff;
  --foe:#ff7340;
  --ok:#7fe09a;
  --danger:#ff5a4f;
  --veil:rgba(4,5,8,.66);
  --display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --font:"Exo 2","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --cut:.55rem;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* интерфейс слегка растёт с экраном: 13–14px на телефоне, около 15px на мониторе 1920 */
html{font-size:clamp(13px,calc(8px + .36vw),15.5px);height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:radial-gradient(120% 70% at 50% 0%,#151a24 0%,var(--bg) 62%);
  color:var(--text);font-family:var(--font);font-size:1rem;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
/* срезанные углы, как у панелей Mechabellum */
.btn,.unit,.seg,.ocard,.toast,.inp,.round,.money,.iconbtn,.camBtn{
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
}
#app{height:100%;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* шапка */
.hud{display:flex;align-items:center;gap:.75rem;padding:.5rem .8rem;background:linear-gradient(180deg,#161a23,#0f1217);border-bottom:1px solid var(--line);position:relative;flex:none}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,211,127,.5),transparent)}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.16em;color:var(--accent);white-space:nowrap}
.round{--cut:.4rem;font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .75rem;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2);white-space:nowrap}
.round .rs{display:none}
.hps{flex:1;display:flex;gap:1rem;min-width:0}
.hp{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem}
.hp.foe{flex-direction:row-reverse}
.hp .who{font-family:var(--display);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;max-width:8em;overflow:hidden;text-overflow:ellipsis}
.hp .bar{flex:1;height:.8rem;background:#08090c;box-shadow:inset 0 0 0 1px var(--line-2);position:relative;overflow:hidden;clip-path:polygon(.35rem 0,100% 0,calc(100% - .35rem) 100%,0 100%)}
.hp .bar i{display:block;height:100%;width:100%;transition:width .5s ease}
.hp.me .bar i{background:linear-gradient(180deg,#8fcbff,var(--me) 55%,#2a6fcf)}
.hp.foe .bar i{margin-left:auto;background:linear-gradient(180deg,#ffb592,var(--foe) 55%,#c24a22)}
.hp .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 .7rem,rgba(0,0,0,.5) .7rem calc(.7rem + 1px))}
.hp b{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;font-size:1.15rem;min-width:2.4em;text-align:center}
.hp.me b{color:#a6d6ff}
.hp.foe b{color:#ffbc9c}
.money{--cut:.4rem;display:flex;align-items:center;gap:.4rem;padding:.3rem .75rem;background:var(--panel-3);box-shadow:inset 0 0 0 1px rgba(255,211,127,.38);white-space:nowrap}
.money svg{width:1.15rem;height:1.15rem;color:var(--accent)}
.money b{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--accent);font-variant-numeric:tabular-nums}
.iconbtn{--cut:.4rem;width:2.75rem;height:2.75rem;background:var(--panel-3);border:0;box-shadow:inset 0 0 0 1px var(--line-2);display:grid;place-items:center;cursor:pointer;flex:none;touch-action:manipulation}
.iconbtn:hover{background:#2a303c}
.iconbtn svg{width:1.3rem;height:1.3rem}
@media (max-width:560px){.logo,.hp .who{display:none}.round{padding:.35rem .5rem}.round .rw{display:none}.round .rs{display:inline}.hps{gap:.55rem}.money{padding:.3rem .5rem}.money b{font-size:1.15rem}.hud{gap:.5rem;padding:.4rem .6rem}}

/* поле занимает всё свободное место, панель снизу */
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;background:#08090c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.camBtn{
  --cut:.4rem;position:absolute;right:.7rem;bottom:.7rem;z-index:2;display:inline-flex;align-items:center;gap:.4rem;
  min-height:2.4rem;padding:0 .75rem;border:0;background:rgba(20,24,31,.88);box-shadow:inset 0 0 0 1px var(--line-2);
  font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;
}
.camBtn svg{width:1.05rem;height:1.05rem}
.undoBtn{bottom:3.6rem}
.votes{display:grid;gap:.45rem;margin-top:.55rem;max-width:16rem}
.votes .btn{min-height:2.6rem}
.votes .btn.voted{color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
@media (min-width:900px){.votes{margin-top:0;grid-column:3;grid-row:1/3}}
.pauseTag{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:2;font-family:var(--display);font-weight:700;font-size:2.4rem;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 18px rgba(0,0,0,.8);pointer-events:none}
.rotHint{position:absolute;left:.7rem;bottom:.7rem;z-index:2;display:flex;align-items:center;gap:.4rem;padding:.35rem .7rem;background:rgba(20,24,31,.88);box-shadow:inset 0 0 0 1px var(--line-2);font-size:.85rem;color:var(--text);pointer-events:none}
.rotHint kbd{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--accent-ink);background:var(--accent);padding:.05rem .4rem}
.panel{background:linear-gradient(180deg,#12151b,#0d1015);border-top:1px solid var(--line);padding:.5rem .7rem .65rem;display:flex;flex-direction:column;gap:.5rem;height:17rem;flex:none}
body.online .panel{height:18.4rem}
#deployUI{display:flex;flex-direction:column;gap:.5rem;min-height:0;height:100%}
#battleUI{display:flex;flex-direction:column;gap:.6rem}

/* карточки юнитов */
.cards{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px;flex:none}
.cards::-webkit-scrollbar{display:none}
.unit{
  --cut:.5rem;position:relative;flex:0 0 5.3rem;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;
  padding:.3rem .2rem .4rem;border:0;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);
  cursor:pointer;touch-action:manipulation;transition:background .15s,box-shadow .15s,transform .1s;
}
.unit:active{transform:scale(.96)}
.unit canvas{width:3.15rem;height:3.15rem;image-rendering:pixelated}
.unit .nm{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.15;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.unit .meta{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--muted);line-height:1}
.unit .pr{display:inline-flex;align-items:center;gap:.15rem;font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--accent)}
.unit .pr svg{width:.8rem;height:.8rem}
.unit.poor .pr{color:var(--danger)}
.unit.poor canvas{filter:grayscale(.75) brightness(.55)}
.unit.sel{background:linear-gradient(180deg,rgba(255,211,127,.18),var(--panel-2));box-shadow:inset 0 0 0 2px var(--accent)}
.unit .hk{position:absolute;top:.2rem;left:.5rem;font-family:var(--display);font-size:.72rem;color:var(--muted);display:none}
@media (hover:hover) and (pointer:fine){.unit .hk{display:block}.unit:not(.sel):hover{background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2)}}

/* сведения */
.info{font-size:.9rem;line-height:1.32;flex:1;min-height:0;overflow-y:auto;padding:0 2px}
.info .head{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
.info .head b{font-family:var(--display);font-weight:600;font-size:1.08rem;letter-spacing:.06em;text-transform:uppercase}
.info .tag{font-size:.85rem;color:var(--muted)}
.info .lvl{font-family:var(--display);color:var(--accent);font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.info .desc{color:var(--muted);margin-top:.2rem;display:none}
.stats{display:flex;flex-wrap:wrap;gap:.15rem .8rem;margin-top:.3rem;font-family:var(--display);font-size:.95rem;letter-spacing:.02em}
.stats span{display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.stats svg{width:.95rem;height:.95rem;color:var(--accent);flex:none}
.stats i{font-style:normal;color:var(--muted);font-family:var(--font);font-size:.82rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.st2{border-collapse:collapse;margin-top:.3rem;font-family:var(--display);font-size:.88rem;letter-spacing:.02em}
.st2 th{font-weight:500;color:var(--muted);font-size:.75rem;text-align:right;padding:0 .7rem .1rem 0;white-space:nowrap}
.st2 td{text-align:right;padding:.05rem .7rem 0 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.st2 td:first-child,.st2 th:first-child{text-align:left;color:var(--muted);font-family:var(--font);font-size:.8rem}
.st2 svg{width:.85rem;height:.85rem;color:var(--accent);vertical-align:-.12rem;margin-right:.15rem}
.st2 svg.w,.stats svg.w{width:1.5rem}
.techs{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.tech{--cut:.4rem;display:inline-flex;align-items:center;gap:.45rem;min-height:2.4rem;padding:0 .7rem;border:0;cursor:pointer;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2);font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--accent);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.tech svg{width:1.6rem;height:1.1rem;color:var(--text)}
.tech span{display:inline-flex;align-items:center;gap:.15rem}
.tech span svg{width:.85rem;height:.85rem;color:var(--accent)}
.tech:hover{background:#2a303c}
.tech.own{box-shadow:inset 0 0 0 1.5px var(--accent);background:rgba(255,211,127,.12);color:var(--ok);cursor:default}
.tip{--cut:.45rem;position:fixed;z-index:30;max-width:19rem;padding:.6rem .8rem;background:rgba(16,19,25,.86);backdrop-filter:blur(3px);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text);font-size:.9rem;line-height:1.35;pointer-events:none;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.tip b{display:flex;justify-content:space-between;gap:1rem;font-family:var(--display);font-weight:600;letter-spacing:.04em;color:#c9d6ff}
.tip .pr{display:inline-flex;align-items:center;gap:.2rem;color:var(--accent)}
.tip .pr svg{width:.85rem;height:.85rem}
.tip p{margin:.3rem 0 0}
.tags span{font-size:.78rem;padding:.05rem .5rem;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.vs{margin-top:.3rem;font-size:.86rem;display:grid;gap:1px}
.vs .good b{color:var(--ok)}
.vs .bad b{color:var(--danger)}
.info .hint{color:var(--muted)}
.row-btns{display:flex;gap:.45rem;margin-top:.35rem;flex-wrap:wrap}
#fightBtn{flex:none}

/* кнопки */
.btn{
  --cut:.5rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.85rem;padding:0 1rem;
  border:0;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2);
  font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;
}
.btn:hover{background:#2a303c}
.btn.sm{min-height:2.3rem;padding:0 .75rem;font-size:.86rem}
.btn.primary{--cut:.7rem;background:linear-gradient(180deg,var(--accent-hi),var(--accent) 58%,#e5ad48);color:var(--accent-ink);box-shadow:none;font-size:1.3rem;font-weight:700;letter-spacing:.14em;min-height:3.3rem}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:default;filter:grayscale(.5)}
.btn.wide{width:100%}
.btn:focus-visible,.unit:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible,.camBtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg{--cut:.5rem;display:flex;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button{flex:1;min-height:2.7rem;border:0;background:transparent;font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.06em;cursor:pointer;touch-action:manipulation;color:var(--muted)}
.seg button.on{background:rgba(255,211,127,.16);color:var(--accent)}
.seg button+button{box-shadow:inset 1px 0 0 var(--line-2)}

/* бой */
.tally{display:flex;justify-content:space-between;gap:1.2rem;font-family:var(--display);font-size:1.1rem;letter-spacing:.05em;text-transform:uppercase}
.tally .me b{color:var(--me)}
.tally .foe b{color:var(--foe)}
.battle-row{display:flex;gap:.55rem;align-items:center}
.battle-row .seg{flex:1}
.armies{display:grid;gap:.4rem;margin-top:.6rem}
.army{display:flex;flex-wrap:wrap;gap:.3rem}
.army span{font-size:.86rem;padding:.15rem .5rem;background:var(--panel-2);box-shadow:inset 2px 0 0 var(--line-2)}
.army.me span{box-shadow:inset 2px 0 0 var(--me)}
.army.foe span{box-shadow:inset 2px 0 0 var(--foe)}
.army .none{color:var(--muted)}
.opp{font-size:.92rem;color:var(--muted);text-align:center;line-height:1.3}
.opp b{color:var(--text)}
.opp.ready b{color:var(--ok)}

/* компьютер: панель под полем одной строкой — карточки, сведения, кнопка */
@media (min-width:900px){
  .panel,body.online .panel{height:8.2rem;padding:.55rem .9rem}
  #deployUI{display:grid;grid-template-columns:minmax(0,max-content) minmax(12rem,1fr) 13rem;grid-template-rows:auto 1fr;gap:.35rem .9rem}
  .cards{grid-column:1;grid-row:1/3;align-self:center}
  .unit{flex-basis:5.3rem}
  .unit canvas{width:3.2rem;height:3.2rem}
  .info{grid-column:2;grid-row:1/3;height:auto}
  .info .desc{display:block}
  .tags{display:flex}
  #oppLine{grid-column:3;grid-row:1;align-self:end}
  #fightBtn{grid-column:3;grid-row:2;min-height:0;height:100%;font-size:1.35rem}
  #oppLine[hidden] + #fightBtn{grid-row:1/3}
  #battleUI{display:grid;grid-template-columns:auto minmax(18rem,26rem) 1fr;align-items:center;gap:.4rem 1.2rem;height:100%}
  #battleUI .battle-row{margin-top:0!important}
  #battleUI .armies{margin-top:0}
}
/* телефон боком: панель справа, полю достаётся вся высота */
@media (orientation:landscape) and (max-height:540px){
  .main{flex-direction:row}
  .panel,body.online .panel{width:19rem;height:auto;border-top:0;border-left:1px solid var(--line);overflow-y:auto}
  #deployUI{display:flex;flex-direction:column}
  .cards{grid-row:auto}
  #fightBtn{height:auto;min-height:3rem;font-size:1.2rem}
  #battleUI{display:flex}
  .hud{padding:.3rem .6rem}
}

/* окна */
.toast{
  --cut:.4rem;position:absolute;left:50%;top:.8rem;transform:translateX(-50%);z-index:3;max-width:92%;
  background:#171b22;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);
  padding:.55rem 1rem;font-weight:600;font-size:.95rem;pointer-events:none;text-align:center;
}
.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--veil);backdrop-filter:blur(2px)}
.ocard{
  --cut:1rem;position:relative;width:min(29rem,100%);max-height:100%;overflow-y:auto;
  background:linear-gradient(180deg,#181c25,#11141a);color:var(--text);padding:1.7rem 1.3rem 1.3rem;
  box-shadow:inset 0 0 0 1px var(--line-2);animation:pop .25s ease both;
}
.ocard::before{content:"";position:absolute;left:var(--cut);right:0;top:0;height:3px;background:var(--accent)}
.ocard.win::before{background:var(--ok)}
.ocard.lose::before{background:var(--danger)}
.ocard h2{margin:0;font-family:var(--display);font-weight:700;font-size:2.15rem;letter-spacing:.07em;text-transform:uppercase;line-height:1.05}
.ocard .sub{margin:.4rem 0 0;color:var(--muted)}
.ocard ol{margin:.85rem 0 .3rem;padding-left:1.4rem;line-height:1.45}
.ocard ol li+li{margin-top:.3rem}
.ocard .label{font-family:var(--display);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .45rem}
.ocard .stack{display:grid;gap:.55rem;margin-top:1.1rem}
.res-lines{margin:.85rem 0 0;display:grid;gap:.3rem;font-size:1.07rem}
.res-lines .neg b{color:var(--danger)}
.res-lines .pos b{color:var(--ok)}
.res-lines .muted{color:var(--muted);font-size:.93rem}
.win h2{color:var(--ok)}
.lose h2{color:var(--danger)}
.sect{margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--line)}
.sect h3{margin:0 0 .55rem;font-family:var(--display);font-weight:600;font-size:1.07rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sect .label{margin-top:0}
.inp{
  --cut:.4rem;width:100%;min-height:3rem;border:0;background:#0c0f14;box-shadow:inset 0 0 0 1px var(--line-2);
  color:var(--text);padding:0 .85rem;font:inherit;font-size:1.07rem;-webkit-user-select:text;user-select:text;
}
.inp:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
.joinrow{display:flex;gap:.55rem}
.joinrow .inp{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.16em;font-family:var(--display)}
.bigcode{font-family:var(--display);font-size:3.6rem;font-weight:700;letter-spacing:.22em;text-align:center;margin:.85rem 0 .3rem;color:var(--accent);text-shadow:0 0 18px rgba(255,211,127,.35)}
.reline{min-height:1.3em;text-align:center;color:var(--muted);margin-top:.7rem;font-size:.93rem}
.brand-title{color:var(--accent);letter-spacing:.14em}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@media (prefers-reduced-motion:reduce){.ocard{animation:none}.unit,.hp .bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="logo">ПЛАЦДАРМ</div>
    <div class="round" id="roundLbl">Раунд 1</div>
    <div class="hps">
      <div class="hp me" title="Твоя база"><span class="who">Ты</span><div class="bar"><i id="hpMeBar"></i></div><b id="hpMe">600</b></div>
      <div class="hp foe" title="База соперника"><span class="who" id="foeName">Бот</span><div class="bar"><i id="hpFoeBar"></i></div><b id="hpFoe">600</b></div>
    </div>
    <div class="money" title="Кредиты"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="currentColor" opacity=".22"/><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.5v9M8 10l8 4.5M16 10l-8 4.5" stroke="currentColor" stroke-width="1.8"/></svg><b id="credits">300</b></div>

      b.quiet || b.ev.push({ k: 'die', x: v.x, y: v.y, r: v.r, side: v.side, air: v.air, t: v.t, u: v });
    }
  }
  b.hurt.length = 0;
}

function attack(b, u, t) {
  const T = u.T, d = T.dmg * u.mul;
  switch (T.atk) {
    case 'melee':
      hurt(b, t, d);
      b.quiet || b.ev.push({ k: 'spark', x: (u.x + t.x) / 2, y: (u.y + t.y) / 2, side: u.side, src: u });
      break;
    case 'gun': case 'bolt':
      hurt(b, t, t.T.heavy ? d * ARMOR : d);
      b.quiet || b.ev.push({ k: T.atk, x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side, air: u.air, src: u, tgt: t });
      break;
    case 'cannon':
      hurt(b, t, d);
      near(b, t.x, t.y, T.splash + 22, (v) => {
        if (v === t || !v.alive || v.side === u.side || v.air) return;
        const dx = v.x - t.x, dy = v.y - t.y, rr = T.splash + v.r;
        if (dx * dx + dy * dy <= rr * rr) hurt(b, v, d * 0.5);
      });
      b.quiet || b.ev.push({ k: 'cannon', x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side, src: u, tgt: t, barrel: u.barrel });
      break;
    case 'rail':
      hurt(b, t, d);
      b.quiet || b.ev.push({ k: 'rail', x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side, src: u, tgt: t });
      break;
    case 'tesla': {
      const pts = [u.x, u.y, t.x, t.y], hit = [t];
      let cur = t, dd = d;
      hurt(b, t, t.T.heavy ? dd * ARMOR : dd);
      for (let j = 0; j < T.jumps; j++) {
        dd *= T.fall;
        let nb = null, nd = Infinity;
        near(b, cur.x, cur.y, T.jumpR + 20, (v) => {
          if (!v.alive || v.side === u.side || v.air || hit.indexOf(v) >= 0) return;
          // перескок считаю от центра до центра: цепь бежит по плотной пехоте, но не между крупными машинами
          const dx = v.x - cur.x, dy = v.y - cur.y, e = Math.sqrt(dx * dx + dy * dy);
          if (e <= T.jumpR && e < nd) { nd = e; nb = v; }
        });
        if (!nb) break;
        hit.push(nb); hurt(b, nb, nb.T.heavy ? dd * ARMOR : dd); pts.push(nb.x, nb.y); cur = nb;
      }
      b.quiet || b.ev.push({ k: 'tesla', pts, side: u.side, src: u });
      break;
    }
    case 'shell': {
      const dx = t.x - u.x, dy = t.y - u.y, dist = Math.sqrt(dx * dx + dy * dy);
      const fl = 0.6 + dist / 260;
      const tvx = (t.x - t.px) / DT, tvy = (t.y - t.py) / DT;
      for (let k = 0; k < (T.salvo || 1); k++) {
        const sc = k ? 24 : 6;   // залп ложится ковром: толпе достаётся, одиночной цели — одна-две ракеты
        const x1 = Math.min(FW, Math.max(0, t.x + tvx * fl + (b.rng() - 0.5) * sc * 2));
        const y1 = Math.min(FH, Math.max(0, t.y + tvy * fl + (b.rng() - 0.5) * sc * 2));
        b.shells.push({ x0: u.x, y0: u.y, x1, y1, t: -k * 0.18, T: fl, dmg: d, rad: T.splash, side: u.side, done: false });
      }
      b.quiet || b.ev.push({ k: 'launch', x: u.x, y: u.y, fx: u.fx, fy: u.fy, side: u.side, src: u });
      break;
    }
    case 'flak':   // осколки задевают соседние цели на той же высоте
      hurt(b, t, d);
      near(b, t.x, t.y, T.splash + 12, (v) => {
        if (v === t || !v.alive || v.side === u.side || v.air !== t.air) return;
        const dx = v.x - t.x, dy = v.y - t.y, rr = T.splash + v.r;
        if (dx * dx + dy * dy <= rr * rr) hurt(b, v, d * 0.5);
      });
      b.quiet || b.ev.push({ k: 'flak', x0: u.x, y0: u.y, x1: t.x, y1: t.y, side: u.side, src: u });
      break;
  }
}

function beamTick(b, u, t) {
  const T = u.T;
  if (t && t.alive && inRange(u, t)) {
    if (u.bTgt === t) u.bT += DT; else { u.bTgt = t; u.bT = 0; }
    u.beam = t;
    hurt(b, t, Math.min(T.dmg + T.ramp * u.bT, T.maxDps) * u.mul * DT);
  } else { u.beam = null; u.bTgt = null; u.bT = 0; }
}

function step(b) {
  if (b.over) return;
  const U = b.units;
  gridBuild(b);
  // 1. цели, разворот и движение
  for (let i = 0; i < U.length; i++) {
    const u = U[i];
    if (!u.alive) continue;
    const T = u.T;
    u.px = u.x; u.py = u.y;
    if (u.drop && b.t < STASIS) { u.vx = 0; u.vy = 0; continue; }   // первая высадка: стазис — не двигается и не стреляет, но получает урон
    u.cd -= DT; u.rt -= DT;
    let t = u.tgt;
    // захват: цель, по которой уже начал бить, держит, пока она жива и в радиусе
    // как в Mechabellum: цель в радиусе захвачена и держится до гибели; пока цель вне радиуса,
    // юнит регулярно перевыбирает ближайшего врага и идёт к нему; после убийства — снова ближайший
    if (t && !t.alive) { t = null; u.lock = false; }
    if (t && u.lock && !inRange(u, t)) u.lock = false;   // захваченная цель ушла из радиуса
    if (!u.lock && (!t || u.rt <= 0)) { t = pickTarget(b, u); u.rt = 0.25 + (u.id % 7) * 0.02; }
    if (t && inRange(u, t)) u.lock = true;
    u.tgt = t;
    let dx, dy, go;
    if (t) {
      dx = t.x - u.x; dy = t.y - u.y;
      go = !inRange(u, t);   // цель в радиусе — стоит на месте, ближе не подходит
    } else {   // бить некого: идёт вперёд до вражеской зоны
      dx = 0; dy = u.side === 0 ? -1 : 1;
      go = u.side === 0 ? u.y > ZONE : u.y < FH - ZONE;
    }
    const cs = turnToward(u, dx, dy), sp = go ? Math.max(0, cs) * (T.spd + u.spdB) : 0;
    if (!go) { u.vx = 0; u.vy = 0; }   // остановка сразу, без проката по инерции
    else { u.vx += (u.fx * sp - u.vx) * 0.35; u.vy += (u.fy * sp - u.vy) * 0.35; }
  }
  // 2. движение
  for (const u of U) if (u.alive) { u.x += u.vx * DT; u.y += u.vy * DT; }
  // 3. расталкивание (тяжёлые почти не сдвигаются)
  for (let i = 0; i < U.length; i++) {
    const u = U[i];
    if (!u.alive) continue;
    near(b, u.x, u.y, u.r + RMAX + 1, (v) => {   // ищем соседей с запасом на самого крупного юнита
      if (v.id <= u.id || !v.alive || v.air !== u.air) return;
      const dx = v.x - u.x, dy = v.y - u.y, md = u.r + v.r + 0.5, d2 = dx * dx + dy * dy;
      if (d2 >= md * md) return;
      let d = Math.sqrt(d2), nx, ny;
      if (d < 1e-6) { nx = (u.id + v.id) % 2 ? 1 : -1; ny = 0; d = 0; } else { nx = dx / d; ny = dy / d; }
      // ранг массы: крупные (от 2×2) > одиночные (1 юнит в отряде) > мелкие; младший полностью уступает старшему
      const ru = u.T.big ? 2 : u.T.cnt === 1 ? 1 : 0, rv = v.T.big ? 2 : v.T.cnt === 1 ? 1 : 0;
      const mu = u.T.atk === 'melee', mw = v.T.atk === 'melee', squeeze = !ru && !rv && mu !== mw;   // Ползун и прочая мелочь
      const o = (md - d) * (ru || rv || squeeze ? 1 : 0.4);   // мелкие между собой толкаются мягко
      let wu, wv;
      if (ru !== rv) {
        wu = ru < rv ? 1 : 0; wv = 1 - wu;
        // мелкий упёрся в старшего — соскальзывает вдоль его края в сторону своего движения (обтекание, как вода)
        const L = wu ? u : v, sg = wu ? -1 : 1, ox = nx * sg, oy = ny * sg;
        if (L.T.cnt > 1 && L.fx * -ox + L.fy * -oy > 0) {
          const tx = -oy, ty = ox, sd = tx * L.fx + ty * L.fy >= 0 ? 1 : -1, sl = L.T.spd * DT * 0.9;
          L.x += tx * sd * sl; L.y += ty * sd * sl;
        }
      } else if (squeeze) {
        // Ползун протискивается сквозь прочую мелочь: раздвигает её и соскальзывает вдоль соседа в сторону движения
        // соседа отодвигаю только вбок от движения Ползуна (не вперёд, на фронт), сам Ползун уступает немного
        const C = mu ? u : v, O = mu ? v : u, ex = mu ? nx : -nx, ey = mu ? ny : -ny, hd = ex * C.fx + ey * C.fy;
        // строго поперёк поля (вдоль линии фронта), чтобы не выталкивать вперёд
        let px = ex, py = 0, pl = Math.abs(px);
        if (pl < 1e-3) { px = (C.id + O.id) % 2 ? 1 : -1; pl = 1; }
        O.x += (px / pl) * o * 0.85; O.y += (py / pl) * o * 0.85;
        C.x -= ex * o * 0.15; C.y -= ey * o * 0.15;
        wu = 0; wv = 0;
        const sg = mu ? -1 : 1, ox = nx * sg, oy = ny * sg;
        if (C.fx * -ox + C.fy * -oy > 0) {
          const tx = -oy, ty = ox, sd = tx * C.fx + ty * C.fy >= 0 ? 1 : -1, sl = C.T.spd * DT * 0.9;
          C.x += tx * sd * sl; C.y += ty * sd * sl;
        }
      } else {
        // стреляющий почти не сдвигается; Ползуны (ближний бой) распихивают и стреляющих — но только мелких
        const pu = ru === 2 ? 1 : u.lock && v.T.atk !== 'melee' ? 0.12 : 1, pv = rv === 2 ? 1 : v.lock && u.T.atk !== 'melee' ? 0.12 : 1;
        wu = pu / (pu + pv); wv = pv / (pu + pv);
      }
      u.x -= nx * o * wu; u.y -= ny * o * wu;
      v.x += nx * o * wv; v.y += ny * o * wv;
    });
  }
  for (const u of U) if (u.alive) {
    u.x = Math.min(FW - u.r, Math.max(u.r, u.x));
    u.y = Math.min(FH - u.r, Math.max(u.r, u.y));
  }
  // 4. атаки
  for (const u of U) {
    if (!u.alive) continue;
    if (u.drop && b.t < STASIS) continue;
    const t = u.tgt, ok = !!t && t.alive && inRange(u, t) && faces(u, t);
    if (u.T.atk === 'beam') { beamTick(b, u, ok ? t : null); if (ok) u.lock = true; continue; }
    const T = u.T;
    // снайпер сначала опускает орудие на плечо (setup); без целей в радиусе убирает обратно
    if (T.setup) { u.dep = Math.max(0, Math.min(1, u.dep + (ok ? DT : -DT) / T.setup)); if (u.dep < 1) continue; }
    // залп по очереди из стволов: между выстрелами gap, после залпа — перезарядка cd
    if (u.burst > 0) {
      u.bt -= DT;
      if (u.bt > 0) continue;
      if (!ok) { u.burst = 0; u.cd = Math.max(0.1, T.cd - u.cdB) * u.cdMul; continue; }
      u.burst--; u.bt = T.gap; u.barrel = (u.barrel + 1) % 2; u.lock = true;
      attack(b, u, t);
      if (u.burst === 0) u.cd = Math.max(0.1, T.cd - u.cdB) * u.cdMul;
      continue;
    }
    if (!ok || u.cd > 0) continue;
    u.lock = true;
    if (u.burstN > 1) { u.burst = u.burstN - 1; u.bt = T.gap; u.barrel = 0; attack(b, u, t); continue; }
    if (T.atk === 'cannon') u.barrel = (u.barrel + 1) % 2;   // одиночные выстрелы — по очереди из пушек
    u.cd = Math.max(0.1, T.cd - u.cdB) * u.cdMul;
    attack(b, u, t);
  }
  // 5. снаряды гаубиц
  for (const s of b.shells) {
    s.t += DT;
    if (s.t < s.T) continue;   // t < 0: ракета залпа ещё ждёт своей очереди
    s.done = true;
    near(b, s.x1, s.y1, s.rad + 16, (v) => {
      if (!v.alive || v.side === s.side || v.air) return;
      const dx = v.x - s.x1, dy = v.y - s.y1, e = Math.sqrt(dx * dx + dy * dy) - v.r;
      if (e > s.rad) return;
      hurt(b, v, s.dmg * (e <= s.rad * 0.4 ? 1 : 1 - 0.5 * (e - s.rad * 0.4) / (s.rad * 0.6)));
    });
    b.quiet || b.ev.push({ k: 'boom', x: s.x1, y: s.y1, r: s.rad, side: s.side });
  }
  if (b.shells.length) b.shells = b.shells.filter((s) => !s.done);
  resolve(b);
  b.t += DT;
  if (!b.alive[0] || !b.alive[1] || b.t >= BATTLE_TIME) finish(b);
}

function finish(b) {
  b.over = true;
  const loss = [0, 0], left = [0, 0];
  for (const u of b.units) if (u.alive) { loss[u.side] += u.T.loss * LOSS_MUL[u.lvl - 1]; left[u.side]++; }
  let win = -1;
  if (left[0] && !left[1]) win = 0;
  else if (left[1] && !left[0]) win = 1;
  else if (left[0] && left[1]) win = loss[0] > loss[1] ? 0 : loss[1] > loss[0] ? 1 : -1;
  // урон стороне = ценность выживших врагов
  b.res = { win, dmg: [Math.round(loss[1]), Math.round(loss[0])], left, timeout: !!(left[0] && left[1]) };
}

function runBattle(squads, seed, round, techs) {
  const b = createBattle(squads, seed, true, round, techs);
  while (!b.over) step(b);
  return b;
}

/* ---------- партия ---------- */
const DIFF = { easy: 0.8, normal: 1, hard: 1.25 };
function newGame(seed, diff) {
  const k = DIFF[diff] || 1;
  return {
    v: 35, seed: seed >>> 0, diff: diff in DIFF ? diff : 'normal', round: 1, hp: [START_HP, START_HP],
    credits: [START_CREDITS, Math.round(START_CREDITS * k)], techs: [{}, {}], squads: [], nextId: 1, botRound: 0, over: null, history: [],
  };
}
function upgradeCost(sq) { return sq.lvl >= 3 ? 0 : Math.round(UT[sq.t].cost * UPG_COST[sq.lvl - 1]); }
// отряд целиком в одной зоне (основной или одной площадке); на площадку — только с DROP_ROUND раунда
function zoneOk(state, col, row, w, h) {
  if (col < 0 || row < 0 || col + w > COLS || row + h > ROWS) return false;
  const d = isDrop(col), left = col < DROP;
  for (let c = col; c < col + w; c++) if (d ? !isDrop(c) || (c < DROP) !== left : !isMain(c)) return false;
  return !(d && state.round < DROP_ROUND);
}
function slotTaken(state, side, col, row, except) { return state.squads.some((s) => s !== except && s.side === side && covers(s, col, row)); }
// влезает ли отряд типа t с углом в (col, row) и поворотом rot: в пределах зоны и на свободные клетки
function canPlace(state, side, t, col, row, rot, except) {
  const [w, h] = foot({ t, rot });
  if (!zoneOk(state, col, row, w, h)) return false;
  for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) if (slotTaken(state, side, col + i, row + j, except)) return false;
  return true;
}
function battleSeed(state) { return mixSeed(state.seed, state.round); }

// итог раунда: урон, доход, конец партии
function applyResult(state, res) {
  state.hp[0] = Math.max(0, state.hp[0] - res.dmg[0]);
  state.hp[1] = Math.max(0, state.hp[1] - res.dmg[1]);
  state.history.push({ round: state.round, win: res.win, dmg: res.dmg.slice() });
  const dead0 = state.hp[0] <= 0, dead1 = state.hp[1] <= 0;
  if (dead0 || dead1 || state.round >= MAX_ROUNDS) {
    state.over = { win: state.hp[0] > state.hp[1] ? 0 : state.hp[1] > state.hp[0] ? 1 : -1 };
    return;
  }
  state.round++;
  state.credits[0] += income(state.round);
  state.credits[1] += Math.round(income(state.round) * (DIFF[state.diff] || 1));
}

/* ---------- бот ---------- */
const BOT_ROWS = { swarm: [0, 1, 2], hound: [0, 1, 2], rail: [4, 5, 3], tesla: [1, 0, 2], goliath: [0, 1], arty: [5, 4, 3], wasp: [3, 2, 4], flak: [3, 4, 2], mustang: [0, 1, 2] };

function botSlot(state, side, t, foeSquads, rng, drop) {
  const pref = BOT_ROWS[UT[t].k], f = UT[t].fp || [1, 1], rots = f[0] === f[1] ? [0] : [0, 1];
  let tx = (COLS - 1) / 2;
  if (foeSquads.length) tx = foeSquads.reduce((a, s) => a + s.col, 0) / foeSquads.length;
  // для высадки — фланг, где у врага меньше войск
  const leftFoe = foeSquads.filter((s) => s.col < COLS / 2).length, weakLeft = leftFoe <= foeSquads.length - leftFoe;
  let best = null, bs = -Infinity;
  for (const rot of rots) for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
    if (isDrop(col) !== !!drop || !canPlace(state, side, t, col, row, rot)) continue;
    const rank = pref.indexOf(row);
    const s = drop
      ? -Math.abs(row - 2) * 0.5 + ((col < COLS / 2) === weakLeft ? 2 : 0) - rot * 0.3 + rng() * 1.5
      : (rank < 0 ? -6 : -rank * 2) - Math.abs(col - tx) * 0.35 - rot * 0.6 + rng() * 1.8;
    if (s > bs) { bs = s; best = { col, row, rot }; }
  }
  return best;
}

// бот видит армию игрока только на начало раунда, как и игрок видит армию бота
// улучшение отряда ботом: запоминаю уровень на начало раунда — до боя игрок видит именно его
function botUp(state, q) {
  if (q.upR !== state.round) { q.upR = state.round; q.lvS = q.lvl; }
  q.lvl++;
}
function botDeploy(state, side, rng) {
  const foe = 1 - side;
  const vis = state.squads.filter((s) => s.side === foe && s.rp < state.round);
  const mine = state.squads.filter((s) => s.side === side);
  const foeVal = UT.map(() => 0), myVal = UT.map(() => 0);
  for (const s of vis) foeVal[s.t] += UT[s.t].cost * LVL_MUL[s.lvl - 1];
  for (const s of mine) myVal[s.t] += UT[s.t].cost * LVL_MUL[s.lvl - 1];
  const foeTotal = foeVal.reduce((a, c) => a + c, 0);

  const typeScore = (t) => {
    const T = UT[t], myTotal = myVal.reduce((a, c) => a + c, 0);
    const spread = (myVal[t] / (myTotal + 150)) * (foeTotal ? 0.7 : 1.2);   // не складывать всё в один тип
    if (!foeTotal) return (T.front ? 0.3 : 0) + (T.k === 'flak' ? -0.5 : 0) - spread;
    let s = 0;
    for (let p = 0; p < UT.length; p++) s += ADV[t][p] * foeVal[p];
    s = s / foeTotal - spread;
    if (T.front) {
      const front = UT.reduce((a, U2, i) => a + (U2.front ? myVal[i] : 0), 0);
      s += Math.max(0, 0.35 - front / (myTotal + 1)) * 1.2;  // впереди нужна «стенка»
    }
    if (T.k === 'flak' && !foeVal[KI.wasp]) s -= 0.6;         // ПВО без авиации у врага бесполезно
    return s;
  };

  let credits = state.credits[side], actions = 0;
  while (actions < 8) {
    let best = null, bs = -Infinity;
    for (let t = 0; t < UT.length; t++) {
      if (UT[t].cost > credits) continue;
      const s = typeScore(t) + (rng() - 0.5) * 0.5;
      if (s > bs) { bs = s; best = { buy: t }; }
    }
    // улучшение уже стоящего отряда — альтернатива покупке
    if (state.round >= 3) for (const sq of state.squads) {
      if (sq.side !== side || sq.lvl >= 3) continue;
      const c = upgradeCost(sq);
      if (c > credits) continue;
      const s = typeScore(sq.t) + 0.12 + (UT[sq.t].cost >= 100 ? 0.08 : 0) - 0.15 * (sq.lvl - 1) + (rng() - 0.5) * 0.5;
      if (s > bs) { bs = s; best = { up: sq }; }
    }
    // прокачки: любая из списка TECHS, если в этот тип юнитов уже вложено достаточно
    state.techs = state.techs || [{}, {}];
    for (const id of Object.keys(TECHS)) {

function makeArt(sz, draw, res) {
  res = res || RES;
  const n = sz * res, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.translate(n / 2, n / 2); g.scale(res, res);
  draw(g);
  const img = g.getImageData(0, 0, n, n), d = img.data, solid = new Uint8Array(n * n);
  for (let i = 0; i < n * n; i++) { if (d[i * 4 + 3] >= 110) { solid[i] = 1; d[i * 4 + 3] = 255; } else d[i * 4 + 3] = 0; }
  // объём: кромка, открытая сверху-слева, светлее; открытая снизу-справа — темнее; плюс лёгкая зернистость металла
  const src = new Uint8ClampedArray(d);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x;
    if (!solid[i]) continue;
    const up = y > 0 && solid[i - n], lf = x > 0 && solid[i - 1], dn = y < n - 1 && solid[i + n], rt = x < n - 1 && solid[i + 1];
    let k = 1, add = 0;
    if (!up || !lf) { k = 1.12; add = 22; }
    else if (!dn || !rt) k = 0.68;
    else if (y > 1 && x > 1 && (!solid[i - 2 * n] || !solid[i - 2])) add = 8;
    const nz = ((x * 7 + y * 13) % 5) - 2;
    for (let q = 0; q < 3; q++) d[i * 4 + q] = Math.min(255, src[i * 4 + q] * k + add + nz);
  }
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const i = y * n + x;
    if (solid[i]) continue;
    if ((x > 0 && solid[i - 1]) || (x < n - 1 && solid[i + 1]) || (y > 0 && solid[i - n]) || (y < n - 1 && solid[i + n])) {
      d[i * 4] = 18; d[i * 4 + 1] = 19; d[i * 4 + 2] = 24; d[i * 4 + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* ===================== ОНЛАЙН ===================== */
// Комната в базе: rooms/КОД = { p: {s0, s1} игроки, on: {s0, s1} кто в сети, cur: номер партии,
//   gN: { seed, rR: { c: {s0, s1} хеши ходов, v: {s0, s1} раскрытые ходы, h: {s0, s1} сверка итога } }, re: голоса за реванш }
// Ход сначала фиксируется хешем, а раскрывается, только когда готовы оба: подсмотреть чужую расстановку нельзя.
// Бой каждый считает у себя: при одинаковых ходах он совпадает до бита.
const FB_VER = '10.12.2';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const DEV = /[?&]dev(?:[&=]|$)/.test(location.search);   // ?dev — локальная имитация сервера для проверки в двух вкладках
let net = null, on = null;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
async function getNet() {
  if (net) return net;
  if (DEV) return (net = localNet());
  const cfg = window.FIREBASE_CONFIG || {};
  if (!cfg.apiKey || !cfg.databaseURL) throw new Error('nocfg');
  if (!window.firebase || !window.firebase.database) {
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
  }
  const fb = window.firebase, app = fb.apps.length ? fb.app() : fb.initializeApp(cfg);
  return (net = fbNet(app.database()));
}
function fbNet(db) {
  const ref = (code) => db.ref('rooms/' + code);
  return {
    watch(code, cb) { const r = ref(code), h = (s) => cb(s.val()); r.on('value', h, () => cb(undefined)); return () => r.off('value', h); },
    update(code, patch) { return ref(code).update(patch); },
    async get(code) { return (await ref(code).once('value')).val(); },
    async txn(code, fn) { const r = await ref(code).transaction(fn); return { ok: r.committed, room: r.snapshot.val() }; },
    presence(code, side) {
      const conn = db.ref('.info/connected'), me = db.ref(`rooms/${code}/on/s${side}`);
      const h = (s) => { if (s.val() === true) { me.onDisconnect().set(false); me.set(true); } };
      conn.on('value', h);
      return () => { conn.off('value', h); me.onDisconnect().cancel(); me.set(false); };
    },
  };
}
// то же самое без сервера: общее хранилище браузера + BroadcastChannel между вкладками
function localNet() {
  // как в Firebase: вкладки пересылают друг другу изменения по путям, а не всю комнату целиком,
  // поэтому одновременные ходы двух игроков не затирают друг друга
  const KEY = 'plazdarm.devrooms', subs = new Map();
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('plazdarm.dev') : null;
  let mem = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } })();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* пусто */ } };
  const fire = (code) => { const room = mem[code]; for (const cb of subs.get(code) || []) setTimeout(() => cb(room === undefined ? null : clone(room)), 15); };
  const put = (obj, path, v) => {
    const ks = path.split('/');
    let o = obj;
    for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = clone(v);
  };
  const merge = (dst, src) => {
    for (const k in src) {
      if (src[k] && typeof src[k] === 'object' && dst[k] && typeof dst[k] === 'object') merge(dst[k], src[k]);
      else dst[k] = clone(src[k]);
    }
  };
  const patchRoom = (code, patch) => { if (!mem[code]) mem[code] = {}; for (const k in patch) put(mem[code], k, patch[k]); };
  if (bc) {
    bc.onmessage = (e) => {
      const d = e.data || {};
      if (d.hello) { bc.postMessage({ all: mem }); return; }
      if (d.all) { merge(mem, d.all); save(); for (const code of subs.keys()) fire(code); return; }
      if (d.patch) patchRoom(d.code, d.patch);
      else if (d.room === null) delete mem[d.code];
      else mem[d.code] = clone(d.room);
      save(); fire(d.code);
    };
    bc.postMessage({ hello: 1 });   // открылась или перезагрузилась вкладка: прошу у соседей их копию
  }
  const api = {
    watch(code, cb) { if (!subs.has(code)) subs.set(code, new Set()); subs.get(code).add(cb); fire(code); return () => subs.get(code).delete(cb); },
    async update(code, patch) { patchRoom(code, patch); save(); if (bc) bc.postMessage({ code, patch: clone(patch) }); fire(code); },
    async get(code) { const r = mem[code]; return r === undefined ? null : clone(r); },
    async txn(code, fn) {
      const cur = mem[code] === undefined ? null : clone(mem[code]), nv = fn(cur);
      if (nv === undefined) return { ok: false, room: cur };
      if (nv === null) delete mem[code]; else mem[code] = clone(nv);
      save(); if (bc) bc.postMessage({ code, room: nv });
      fire(code);
      return { ok: true, room: nv };
    },
    presence(code, side) {
      const k = `on/s${side}`, off = () => { api.update(code, { [k]: false }); };
      api.update(code, { [k]: true });
      addEventListener('pagehide', off);
      return () => { removeEventListener('pagehide', off); off(); };
    },
  };
  return api;
}

const myName = () => (prefs.name || '').trim().slice(0, 16) || 'Игрок';
function codeGen() { let s = ''; for (let i = 0; i < 5; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function urlWith(code) { const u = new URL(location.href); if (code) u.searchParams.set('room', code); else u.searchParams.delete('room'); return u; }
function setRoomParam(code) { try { const u = urlWith(code); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) { /* пусто */ } }
// адрес опубликованной игры: если игра открыта из файла на компьютере, ссылка ведёт сюда, а не на файл

function onlineError(e) {
  const m = (e && (e.code || e.message)) || '';
  toast(m === 'nocfg' ? 'Онлайн ещё не настроен: в файл нужно вставить конфиг Firebase.'

    : /permission|denied|perm/i.test(m) ? 'Сервер отклонил запрос: проверь правила базы в Firebase.'
    : 'Ошибка связи с сервером. Попробуй ещё раз.', 4500);
}

async function hostRoom() {
  let n;
  try { n = await getNet(); } catch (e) { onlineError(e); return; }
  for (let i = 0; i < 6; i++) {
    const code = codeGen(), room = { v: GAME_VER, t: Date.now(), p: { s0: { id: PID, nm: myName() } }, cur: 1, g1: { seed: (Math.random() * 4294967296) >>> 0 } };
    try {
      const r = await n.txn(code, (cur) => (cur ? undefined : room));
      if (r.ok) { enterRoom(code, 0); return; }
    } catch (e) { onlineError(e); return; }
  }
  toast('Не удалось создать комнату, попробуй ещё раз');
}
async function joinRoom(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { toast('Код комнаты: 5 букв и цифр'); return; }
  let n;
  try { n = await getNet(); } catch (e) { onlineError(e); return; }
  try {
    await n.get(code);   // прогреваю кеш: транзакция Firebase иначе может начаться с пустого значения
    let side = -1;
    const r = await n.txn(code, (cur) => {
      if (!cur) { side = -1; return cur; }
      if (cur.v !== GAME_VER) { side = -3; return undefined; }
      const p = cur.p || {};
      if (p.s0 && p.s0.id === PID) { side = 0; return cur; }
      if (p.s1 && p.s1.id === PID) { side = 1; return cur; }
      if (p.s1) { side = -2; return undefined; }
      cur.p = Object.assign({}, p, { s1: { id: PID, nm: myName() } });
      side = 1;
      return cur;
    });
    if (side === -2) { toast('В этой комнате уже двое'); return; }
    if (side === -3) { toast('Комната создана в другой версии игры. Обновите страницу и создайте новую.', 5000); return; }
    if (!r.room || side < 0) { toast('Комнаты с таким кодом нет'); return; }
    enterRoom(code, side);
  } catch (e) { onlineError(e); }
}
function enterRoom(code, side) {
  stopBot();

  phase = 'lobby';
  showLobby();
  on.unwatch = net.watch(code, (room) => { if (on && on.code === code) onRoom(room); });
  on.presOff = net.presence(code, side);
  showPanel(); renderCards();
}
function leaveRoom(keepPref) {
  if (!on) return;
  try { if (on.unwatch) on.unwatch(); } catch (e) { /* пусто */ }
  try { if (on.presOff) on.presOff(); } catch (e) { /* пусто */ }

}
function exitOnline() {
  leaveRoom(false);
  mode = 'bot'; MY = 0; FOE = 1; FLIP = false;
  battle = null; selType = -1; selSq = null; drag = null;
  clearFx(); clearDecal(); camReset();
  state = loadSave();
  phase = 'menu';
  updateHud(); showPanel(); renderCards(); renderInfo();
  showMenu();
}
function onRoom(room) {
  if (room === undefined) { onlineError({ code: 'permission' }); return; }
  if (!room) { toast('Комната закрыта', 3000); exitOnline(); return; }
  on.room = room;
  syncOnline();
}
// состояние партии целиком выводится из журнала ходов в комнате; посчитанные раунды кешируются
function derive() {
  const room = on.room, n = room.cur || 1, G = room['g' + n];
  if (!G || typeof G.seed !== 'number') return null;
  if (on.game !== n) { on.game = n; on.cache = new Map(); on.shown = -1; on.uiRound = 0; on.revealed = {}; on.first = true; on.rematchFor = 0; }
  let base = onlineGame(G.seed), R = 1, last = 0, bad = -1;
  for (; R <= MAX_ROUNDS; R++) {
    const rd = G['r' + R], v = rd && rd.v;
    if (!v || !v.s0 || !v.s1) break;
    let res = on.cache.get(R);
    if (!res) {

        const x = v['s' + s];
        if (x && typeof x.o === 'string' && typeof x.salt === 'string' && cyrb53(x.o + x.salt) === c['s' + s]) {
          try { o[s] = JSON.parse(x.o); } catch (e) { o[s] = null; }
        }
      }
      if (!o[0] || !o[1]) { bad = !o[0] ? 0 : 1; break; }
      res = resolveRound(base, o[0], o[1]);
      if (res.bad !== undefined) { bad = res.bad; break; }

}
function syncOnline() {
  if (!on || !on.room || phase === 'error') return;
  if (on.room.v !== GAME_VER) { showError('Комната создана в другой версии игры. Обновите страницу и создайте новую комнату.'); return; }
  const room = on.room, p = room.p || {}, d = derive();

  const opp = p['s' + FOE];
  on.oppName = opp ? String(opp.nm || 'Соперник').slice(0, 16) : '';
  if (d.bad >= 0) {
    showError(d.bad === MY ? 'Твой ход не прошёл проверку.' : 'Ход соперника не прошёл проверку. Возможно, у вас разные версии игры: обновите страницу оба.');
    return;
  }
  // сверка итогов боёв между игроками
  for (let r = 1; r <= d.last; r++) {
    const res = on.cache.get(r), h = (d.G['r' + r] && d.G['r' + r].h) || {};
    if (!h['s' + MY]) net.update(on.code, { [`g${d.n}/r${r}/h/s${MY}`]: res.check }).catch(() => {});
    else if (h['s' + FOE] && h['s' + FOE] !== res.check && !on.warned) { on.warned = true; toast('Итоги боя у вас разошлись. Если повторится, напиши мне.', 6000); }
  }
  if (on.first) { on.first = false; on.shown = d.last; }      // при входе в комнату прошлые бои не показываю
  const rd = d.G['r' + d.R] || {}, c = rd.c || {}, v = rd.v || {};
  const myCommit = !!c['s' + MY], oppCommit = !!c['s' + FOE];
  if (!d.over && c.s0 && c.s1 && !v['s' + MY]) reveal(d.n, d.R);   // оба готовы: раскрываю свой ход
  setOppLine(!!(room.on && room.on['s' + FOE]), oppCommit, !!opp);
  $('foeName').textContent = on.oppName || 'Соперник';
  if (phase === 'battle' || phase === 'result') return;          // игрок досматривает бой или итоги раунда
  if (d.last > on.shown) { playOnlineRound(on.shown + 1); return; }
  if (d.over) { onlineOver(d); return; }
  if (!opp) {
    phase = 'lobby';
    if (ocard.dataset.kind !== 'menu' && ocard.dataset.kind !== 'lobby') showLobby();
    showPanel();
    return;
  }
  if (ocard.dataset.kind === 'lobby' || ocard.dataset.kind === 'over') closeCard();
  if (on.uiRound !== d.R) {           // новый раунд: рабочая копия общего состояния плюс мой черновик
    on.uiRound = d.R;
    state = clone(d.base);
    on.lvl0 = {};
    for (const q of state.squads) if (q.side === MY) on.lvl0[q.id] = q.lvl;
    on.tech0 = Object.assign({}, (state.techs || [{}, {}])[MY]);
    if (myCommit) { const sc = loadCommit(d.n, d.R); if (sc) { try { applyOrders(state, MY, JSON.parse(sc.o)); } catch (e) { /* пусто */ } } }

}
function setOppLine(online, ready, present) {
  const el = $('oppLine');
  const nm = `<b>${esc(on.oppName || 'Соперник')}</b>`;
  el.innerHTML = !present ? 'Ждём второго игрока' : !online ? `${nm} не в сети` : ready ? `${nm} готов к бою` : `${nm} расставляет армию`;
  el.classList.toggle('ready', present && online && ready);
}
function collectOrders() {
  const n = [], u = [];
  for (const q of state.squads) {
    if (q.side !== MY) continue;
    if (on.lvl0[q.id] === undefined) n.push([q.t, q.col, q.row, q.lvl, q.rot || 0]);
    else if (q.lvl > on.lvl0[q.id]) u.push([q.id, q.lvl]);
  }
  const t = Object.keys((state.techs || [{}, {}])[MY]).filter((k) => !on.tech0[k]);
  return { n, u, t };
}
function readyOnline() {
  if (mode !== 'online' || !on || phase !== 'deploy' || !overlay.hidden) return;
  if (!state.squads.some((s) => s.side === MY)) { toast('Сначала поставь хотя бы один отряд'); return; }
  const o = JSON.stringify(collectOrders()), salt = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  const n = on.game, R = on.uiRound;
  saveCommit(n, R, { o, salt });
  selType = -1; selSq = null;
  phase = 'wait';
  showPanel(); renderCards(); renderInfo();
  net.update(on.code, { [`g${n}/r${R}/c/s${MY}`]: cyrb53(o + salt) }).catch((e) => { phase = 'deploy'; showPanel(); renderInfo(); onlineError(e); });
}
function reveal(n, R) {
  const key = n + ':' + R;
  if (on.revealed[key]) return;
  const d = loadCommit(n, R);
  if (!d) return;
  on.revealed[key] = true;
  net.update(on.code, { [`g${n}/r${R}/v/s${MY}`]: d }).catch((e) => { on.revealed[key] = false; onlineError(e); });
}
// ход и черновик расстановки переживают перезагрузку страницы
const mem = {};
const skey = (k, n, R) => `plazdarm.${k}.${on.code}.${MY}.${n}.${R}`;
function putStore(key, val) { mem[key] = val; try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* пусто */ } }
function getStore(key) { if (mem[key]) return mem[key]; try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }

function saveDraft() { if (on && phase === 'deploy') putStore(skey('d', on.game, on.uiRound), collectOrders()); }
function restoreDraft(n, R) { const o = getStore(skey('d', n, R)); if (o) applyOrders(state, MY, o); }

  const res = on.cache.get(r);
  if (!res) return;
  on.shown = r; on.pending = res; on.bkey = `g${on.game}/r${r}`; on.fast = false; on.voted = {};
  state = clone(res.pre);
  if (ocard.dataset.kind === 'lobby') closeCard();
  launchBattle(state);
}
function endOnlineBattle() {
  const res = on.pending.res, round = state.round, shown = { round, credits: state.credits[MY] };
  state = clone(on.pending.post);
  updateHud(state.over ? null : shown);
  if (state.over) { phase = 'over'; showPanel(); showOver(); syncOnline(); }
  else { phase = 'result'; showPanel(); showResult(res, round); }
}
function nextOnline() {
  closeCard();
  phase = 'sync';
  battle = null; clearFx(); clearDecal();
  syncOnline();
}
function onlineOver(d) {
  if (phase !== 'over') {
    state = clone(d.base);
    if (battle && !battle.over) battle = null;
    phase = 'over';
    updateHud(); showPanel(); showOver();
  }
  const re = on.room.re || {}, line = $('reLine');
  if (line) line.textContent = re['s' + FOE] ? (re['s' + MY] ? 'Начинаем заново…' : 'Соперник хочет реванш') : re['s' + MY] ? 'Ждём ответа соперника' : '';
  if (re.s0 && re.s1 && MY === 0 && on.rematchFor !== d.n) {
    on.rematchFor = d.n;
    net.update(on.code, { cur: d.n + 1, ['g' + (d.n + 1)]: { seed: (Math.random() * 4294967296) >>> 0 }, re: null }).catch(onlineError);
  }
}
function voteRematch() {
  if (!on) return;
  net.update(on.code, { [`re/s${MY}`]: true }).catch(onlineError);
  const l = $('reLine');
  if (l && !l.textContent) l.textContent = 'Ждём ответа соперника';
}
function showLobby() {
  if (!on) return;
  // экран ожидания не перерисовываю, пока он открыт для той же комнаты: иначе кнопка меняется под пальцем
  if (!overlay.hidden && ocard.dataset.kind === 'lobby' && ocard.dataset.code === on.code) return;
  openCard(`<h2>Комната</h2><div class="bigcode">${esc(on.code)}</div>
    <p class="sub" style="text-align:center">Отправь другу ссылку или код. Партия начнётся, как только он войдёт.</p>
    <input class="inp" id="linkIn" readonly value="${esc(shareLink(on.code))}" style="margin-top:.6rem;font-size:.85rem;text-align:center">
    <div class="stack"><button class="btn primary" id="shareBtn" type="button">${canNativeShare() ? 'Поделиться ссылкой' : 'Скопировать ссылку'}</button>
    <button class="btn" id="leaveBtn" type="button">Выйти из комнаты</button></div>`, '', 'lobby');
  ocard.dataset.code = on.code;
  $('linkIn').onfocus = (e) => e.target.select();
  $('shareBtn').onclick = (e) => { e.preventDefault(); shareRoom(); };
  $('leaveBtn').onclick = () => exitOnline();
}
// копирование без разрешений браузера (запасной путь для телефонов)
function copyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
let sharing = false;
async function shareRoom() {
  if (!on) return;
  if (sharing) return;
  const link = shareLink(on.code);
  if (canNativeShare()) {
    sharing = true;
    try { await navigator.share({ title: 'Плацдарм', text: `Заходи в мою комнату в «Плацдарме», код ${on.code}`, url: link }); sharing = false; return; }
    catch (e) { sharing = false; if (e && e.name === 'AbortError') return; }
  }

  try { await navigator.clipboard.writeText(link); toast('Ссылка скопирована'); }
  catch (e) { const li = $('linkIn'); if (li) { li.focus(); li.select(); } toast('Скопируй ссылку из поля выше', 3500); }
}
function showError(text) {

  openCard(`<h2>Партия остановлена</h2><p class="sub">${esc(text)}</p>
    <div class="stack"><button class="btn primary" id="errBtn" type="button">В меню</button></div>`, 'lose', 'error');
  $('errBtn').onclick = () => { phase = 'menu'; exitOnline(); };
  showPanel();
}

/* ---------- кнопки и клавиши ---------- */
fightBtn.addEventListener('click', () => { if (mode === 'online') readyOnline(); else startBattle(); });
$('skipBtn').addEventListener('click', skipBattle);
$('menuBtn').addEventListener('click', () => {
  if (overlay.hidden || ocard.dataset.kind === 'lobby') showMenu();
  else if (ocard.dataset.kind === 'menu' && phase !== 'menu') { closeCard(); if (mode === 'online') syncOnline(); }
});
for (const b of $('speedSeg').children) b.addEventListener('click', () => { speed = +b.dataset.speed; prefs.speed = speed; savePrefs(); showPanel(); });
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyZ' || e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) { e.preventDefault(); undo(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if ((e.key === 'Enter' || e.key === ' ') && tag === 'BUTTON') return;   // кнопка сама обработает
  if (!overlay.hidden) {
    if (e.key === 'Escape' && ocard.dataset.kind === 'menu' && phase !== 'menu') { closeCard(); if (mode === 'online') syncOnline(); }
    return;
  }
  if (e.key === '0' || e.key === 'Home') { camToggle(); return; }
  if (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_') { zoomAt(W / 2, H / 2, e.key === '-' || e.key === '_' ? 1 / 1.25 : 1.25); return; }
  if (phase === 'deploy') {
    if (e.key >= '1' && e.key <= String(UT.length)) selectType(+e.key - 1);
    else if (e.key === 'Escape') { selType = -1; selSq = null; renderCards(); renderInfo(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (mode === 'online') readyOnline(); else startBattle(); }
    else if ((e.key === 'u' || e.key === 'г') && selSq) upgradeSquad(selSq);
    else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') rotateSel();
    else if ((e.key === 'Delete' || e.key === 'Backspace') && selSq) removeSquad(selSq);
  } else if (phase === 'battle') {
    if (e.key === 's' || e.key === 'ы') skipBattle();
    else if (e.key === '1' || e.key === '2' || e.key === '4') { speed = +e.key; prefs.speed = speed; savePrefs(); showPanel(); }
  }
});

/* ---------- голосование в онлайне, пауза, фон ---------- */
// голоса за ускорение ×2 (с 10-й секунды боя) и пропуск (с 20-й): срабатывают, когда проголосовали оба
function vote(kind) {
  if (mode !== 'online' || !on || !on.bkey || phase !== 'battle' || on.voted[kind]) return;
  on.voted[kind] = true;
  net.update(on.code, { [`${on.bkey}/${kind}/s${MY}`]: true }).catch((e) => { on.voted[kind] = false; onlineError(e); });
  battleControls(true);
}
function checkVotes(room) {
  if (mode !== 'online' || !on || !on.bkey || phase !== 'battle') return;
  const [g, r] = on.bkey.split('/'), rd = room[g] && room[g][r];
  if (!rd) return;
  const sp = rd.sp || {}, sk = rd.sk || {};
  if (sp.s0 && sp.s1 && !on.fast) { on.fast = true; toast('Оба за ускорение: ×2'); }
  if (sk.s0 && sk.s1 && battle && !battle.over) { toast('Оба за пропуск'); skipBattle(true); }

let ctlCache = '';
function battleControls(force) {

  const key = [online, showSp, showSk, on && on.voted && on.voted.sp, on && on.voted && on.voted.sk, on && on.oppVote && on.oppVote.sp, on && on.oppVote && on.oppVote.sk, paused, phase].join('|');

  vs.hidden = !showSp; vk.hidden = !showSk;
  vs.classList.toggle('voted', !!mine.sp); vk.classList.toggle('voted', !!mine.sk);
  vs.textContent = mine.sp ? 'Ждём соперника… ×2' : opp.sp ? 'Соперник за ×2 — ускорить' : 'Ускорить ×2';
  vk.textContent = mine.sk ? 'Ждём соперника… пропуск' : opp.sk ? 'Соперник за пропуск — пропустить' : 'Пропустить';
  $('pauseBtn').hidden = !(mode !== 'online' && phase === 'battle');
  $('pauseTag').hidden = !(paused && mode !== 'online' && phase === 'battle');
}
function togglePause() { if (mode === 'online' || phase !== 'battle') return; paused = !paused; battleControls(true); }
$('voteSpeed').addEventListener('click', () => vote('sp'));
$('voteSkip').addEventListener('click', () => vote('sk'));
$('pauseBtn').addEventListener('click', togglePause);
window.addEventListener('keydown', (e) => { if ((e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З') && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') togglePause(); });
// свёрнутая вкладка: онлайн-бой продолжается (по возвращении догоняю время), бой с ботом стоит
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = performance.now(); return; }
  if (mode === 'online' && battle && phase === 'battle' && !battle.over && hiddenAt) {
    const lag = Math.min(120, (performance.now() - hiddenAt) / 1000) * speed;
    const q = battle.quiet; battle.quiet = true;
    for (let i = 0, n = Math.floor(lag / DT); i < n && !battle.over; i++) step(battle);
    battle.quiet = q; battle.ev.length = 0; clearFx(); updateTally(true);
  }
  hiddenAt = 0;
});
// сторож онлайна: пока ждём соперника, регулярно пересматриваю комнату — повторит раскрытие хода после сбоя связи
setInterval(() => { if (mode === 'online' && on && on.room && (phase === 'wait' || phase === 'deploy')) { on.revealed = {}; syncOnline(); } }, 2500);

/* ---------- старт ---------- */
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(stage);
window.addEventListener('resize', layout);
window.addEventListener('pagehide', save);
state = loadSave();
layout();
renderCards();
updateHud();
showPanel();
showMenu();
requestAnimationFrame(frame);
</script>
